name: Simulate Fixture Bonus

# Manual trigger -- runs scripts/simulate_fixture_bonus.py for a matchweek
# range, populating fpl_fixture_bonus_montecarlo_v1. Run this whenever
# projections are regenerated for a range (goals/assists changing means
# the simulation inputs have changed too), then re-run
# refresh_fpl_projection_fixture_v6 for the same fixtures to pick up the
# new bonus values.
on:
  workflow_dispatch:
    inputs:
      from_matchweek:
        description: 'First matchweek'
        required: true
        type: string
      to_matchweek:
        description: 'Last matchweek'
        required: true
        type: string

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt

      - name: Simulate fixture bonus
        run: python scripts/simulate_fixture_bonus.py --from-matchweek "${{ inputs.from_matchweek }}" --to-matchweek "${{ inputs.to_matchweek }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
