name: International import (results, tournaments, Nations League fixtures)

# Daily international football load -- see scripts/intl_import.py. Separate
# from the football, NFL and tennis imports on purpose. 06:30 UTC: after the
# NFL import and before the 07:00 FPL run rebuilds the site. Also runs after
# each successful "Apply database migrations" run, so the first load follows
# the schema straight away, and on any change to the importer. Runs the unit tests first, so a broken parser
# never writes. Writes a pipeline_runs row (job_name intl_import). After the
# load it refits model IP1 and writes fixture projections and the Nations
# League group odds (scripts/intl_projections.py).

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_run:
    workflows: ['Apply database migrations']
    types: [completed]
  # An importer change reloads at once rather than at 06:30.
  push:
    branches: [main]
    paths: ['scripts/intl_import.py', 'scripts/intl_static.py', 'scripts/intl_projections.py']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and check only (no writes)'
        type: boolean
        default: false

permissions:
  contents: read

# One load at a time: schedule, push and migration triggers can coincide.
concurrency:
  group: intl-import
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt pytest
      - name: Tests
        run: python -m pytest -q scripts/test_intl_import.py scripts/test_intl_squads.py
      - name: Import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python intl_import.py --dry-run
          else
            python intl_import.py
          fi

  # Women's internationals (martj42/womens-international-results) into the
  # intlw schema: same importer with --women, its own job so one side failing
  # never stops the other. Writes a pipeline_runs row (job_name intlw_import).
  women:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt pytest
      - name: Tests
        run: python -m pytest -q scripts/test_intl_import.py scripts/test_intl_squads.py
      - name: Import (women)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python intl_import.py --women --dry-run
          else
            python intl_import.py --women
          fi
