name: Gameweek report

# FPL gameweek reflection or preview on demand (scripts/fpl_gameweek_report.py): a draft
# to check, or a published version. The projections pipeline publishes the
# reflection automatically once it is due; this is for drafts, re-runs and
# corrections (a correction is a new version; published ones never change).
# Output is in the run's annotations (logs can't be read from cloud sessions).
on:
  # The provisional reflection on the night the gameweek ends (Chris, 21 Oct
  # 2026): checks after a 20:00 kick-off in BST and GMT. The report decides
  # whether anything is due; most nights it exits at once.
  schedule:
    - cron: '20 21 * * *'
    - cron: '20 22 * * *'
    - cron: '50 22 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Report'
        type: choice
        options: [reflection, preview]
        default: reflection
      gw:
        description: 'Gameweek (not needed with auto)'
        required: false
        type: string
      auto:
        description: 'As the scheduled run: the reflection if one is due (pg_cron dispatch, audit P-01)'
        type: boolean
        default: false
      frozen:
        description: 'Preview only: from the deadline snapshot (the locked version)'
        type: boolean
        default: false
      publish:
        description: 'Publish (otherwise a draft, visible only to the database)'
        type: boolean
        default: false
      rebuild_site:
        description: 'Rebuild the site afterwards (only matters when publishing)'
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: a pg_cron dispatch and the GitHub cron fallback (or an
# admin re-run) queue rather than race (audit P-01).
concurrency:
  group: gameweek-report
  cancel-in-progress: false

jobs:
  # Audit P-01 (22 Oct 2026): pg_cron dispatches this workflow on time
  # (private.workflow_dispatch_slots, via netlify/functions/trigger-workflow);
  # GitHub's own cron, hours late, is the fallback. A late scheduled run asks
  # whether pg_cron already ran its slot and, if so, stops here. Any doubt
  # (an error, no answer) means run: a duplicate run is harmless, a missed
  # one is not.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          R=$(curl -s --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/workflow_slot_covered" \
                -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"p_workflow\": \"gameweek-report\", \"p_cron\": \"$CRON\"}" || echo "request failed")
          if [ "$R" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pg_cron already dispatched the slot for '$CRON'; this late scheduled run is skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Slot not covered (answer: ${R:0:200}); running."
          fi

  report:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Report
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          IN_GW: ${{ inputs.gw }}
          IN_KIND: ${{ inputs.kind }}
          IN_FROZEN: ${{ inputs.frozen }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_AUTO: ${{ inputs.auto }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${IN_AUTO}" = "true" ]; then
            ARGS="--auto --only reflection"
          elif [ -z "${IN_GW}" ]; then
            echo "::error::gw is required unless auto is ticked"; exit 1
          else
          ARGS="--kind ${IN_KIND} --gw ${IN_GW}"
          if [ "${IN_FROZEN}" = "true" ]; then ARGS="$ARGS --frozen"; fi
          if [ "${IN_PUBLISH}" = "true" ]; then ARGS="$ARGS --publish"; fi
          fi
          python scripts/fpl_gameweek_report.py $ARGS 2>&1 | tee /tmp/r.log
          STATUS=${PIPESTATUS[0]}
          ENCODED=$(tail -c 3500 /tmp/r.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/\r/%0D/g')
          if [ "$STATUS" -ne 0 ]; then echo "::error::$ENCODED"; else echo "::notice::$ENCODED"; fi
          exit $STATUS
      - name: Rebuild site
        if: success() && inputs.publish && inputs.rebuild_site
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK_URL }}" ]; then echo "::notice::No build hook"; exit 0; fi
          curl -s -o /dev/null -w "%{http_code}\n" -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_URL }}"
