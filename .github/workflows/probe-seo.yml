name: Probe SEO (temporary)
on:
  push:
    branches: [probe-seo-2026-10-29]
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[probe-results]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          set +e; rm -rf probe; mkdir -p probe
          UA_G='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          base=$(head -1 base.txt 2>/dev/null || echo https://fixtureshark.com)
          i=0
          while read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            case "$u" in http*) url="$u";; *) url="$base$u";; esac
            curl -sS -A "$UA_G" -D probe/$i.headers -o probe/$i.html -w "$i $u %{http_code} %{size_download}\n" "$url" >> probe/summary.txt || echo "$i $u FAIL" >> probe/summary.txt
            f=probe/$i.html
            {
              echo "== $i $u"
              grep -io '<title>[^<]*</title>' $f | head -1 || true
              grep -io '<link rel="canonical"[^>]*>' $f | head -1 || true
              grep -io '<meta name="robots"[^>]*>' $f | head -1 || true
              grep -i '^x-robots-tag' probe/$i.headers || true
              echo "words: $(sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' $f | wc -w)"
            } >> probe/digest.txt
          done < urls.txt
          for s in core football international fpl nfl tennis finance tv; do
            n=$(curl -sS "$base/sitemaps/$s.xml" | grep -c '<loc>' || true)
            echo "$s $n" >> probe/sitemap-counts.txt
          done
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe && git commit -m "probe results [probe-results]" && git push
