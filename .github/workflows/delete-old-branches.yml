# One-off (5 Oct 2026, approved by Chris): delete every branch except main.
# All were checked first: merged PRs, closed PRs whose work reached main by a
# later PR, and throwaway probe branches. A backup bundle of all 201 branches
# was taken beforehand. Runs once when this file lands on main, then removes
# itself.
name: Delete old branches (one-off)
on:
  push:
    branches: [main]
    paths: [.github/workflows/delete-old-branches.yml]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | grep -vx main > branches.txt
          echo "Deleting $(wc -l < branches.txt) branches"
          failed=0
          while IFS= read -r b; do
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${b}" >/dev/null; then echo "deleted $b"; else echo "::warning::could not delete $b"; failed=$((failed+1)); fi
          done < branches.txt
          echo "Failed: $failed"
          echo "Left: $(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | tr '\n' ' ')"
      - name: Remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin main
          git rm -q .github/workflows/delete-old-branches.yml
          git commit -m "Remove the one-off branch clean-up workflow [skip netlify]"
          git push origin HEAD:main
