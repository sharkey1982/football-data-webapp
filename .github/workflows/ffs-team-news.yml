name: FFS team news

# Fantasy Football Scout's predicted line-ups (public team-news page) for
# /admin/lineup-compare. One page fetch per run. scripts/ffs_team_news.py.
# probe: store the page's structure in analysis_results and save nothing
# (for checking the parser after a layout change).

on:
  schedule:
    - cron: '20 7 * * *'
    - cron: '20 17 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: Store the page structure only (no save)
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: a pg_cron dispatch and the GitHub cron fallback (or an
# admin re-run) queue rather than race (audit P-01).
concurrency:
  group: ffs-team-news
  cancel-in-progress: false

jobs:
  # Audit P-01 (22 Oct 2026): pg_cron dispatches this workflow on time
  # (private.workflow_dispatch_slots, via netlify/functions/trigger-workflow);
  # GitHub's own cron, hours late, is the fallback. A late scheduled run asks
  # whether pg_cron already ran its slot and, if so, stops here. Any doubt
  # (an error, no answer) means run: a duplicate run is harmless, a missed
  # one is not.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          R=$(curl -s --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/workflow_slot_covered" \
                -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"p_workflow\": \"ffs-team-news\", \"p_cron\": \"$CRON\"}" || echo "request failed")
          if [ "$R" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pg_cron already dispatched the slot for '$CRON'; this late scheduled run is skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Slot not covered (answer: ${R:0:200}); running."
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt pytest
      - run: python -m pytest -q scripts/test_ffs_team_news.py
      - name: Fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          set +e
          python scripts/ffs_team_news.py ${{ inputs.probe && '--probe' || '' }} 2>&1 | tee /tmp/ffs.log
          STATUS=${PIPESTATUS[0]}
          ENCODED=$(tail -c 3000 /tmp/ffs.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/\r/%0D/g')
          if [ "$STATUS" -ne 0 ]; then echo "::error::$ENCODED"; else echo "::notice::$ENCODED"; fi
          exit $STATUS
