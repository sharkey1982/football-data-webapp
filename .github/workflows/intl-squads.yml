name: International squads (Wikipedia)

# Daily: every current nation's squad and recent call-ups from its English
# Wikipedia page -- see scripts/intl_squads.py -- with each club matched to
# its FixtureShark page and its ClubElo rating (scripts/club_match.py). 07:20 UTC, after the 06:30
# international import. Also after each successful "Apply database migrations"
# run and on any change to the script. Tests first. Writes a pipeline_runs row
# (job_name intl_squads).

on:
  schedule:
    - cron: '20 7 * * *'
  workflow_run:
    workflows: ['Apply database migrations']
    types: [completed]
  push:
    branches: [main]
    paths: ['scripts/intl_squads.py', 'scripts/club_match.py']
  workflow_dispatch:

permissions:
  contents: read

# One load at a time: schedule, push and migration triggers can coincide.
concurrency:
  group: intl-squads
  cancel-in-progress: false

jobs:
  # Audit P-11 (22 Oct 2026): after "Apply database migrations", reload
  # only when the migrations it applied touch the intl / intlw schemas.
  # Before, every migration push re-ran the full load (about 4.5 times the
  # needed calls to Wikipedia, ClubElo and the sources). Other triggers
  # always run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      intl: ${{ steps.check.outputs.intl }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RUN_OK: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then echo "intl=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$RUN_OK" != "true" ]; then echo "intl=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- supabase/migrations/ || true)
          if [ -n "$FILES" ] && grep -l -i -E '\bintlw?\.' $FILES >/dev/null 2>&1; then
            echo "intl=true" >> "$GITHUB_OUTPUT"; echo "Migrations touching intl/intlw: $FILES"
          else
            echo "intl=false" >> "$GITHUB_OUTPUT"; echo "No intl/intlw migration in this push; skipping the reload."
          fi

  run:
    needs: changes
    if: needs.changes.outputs.intl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt pytest
      - name: Tests
        run: python -m pytest -q scripts/test_intl_squads.py
      - name: Import squads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: python intl_squads.py

  # Women's squads from each women's national team page (intlw tables;
  # pipeline_runs job_name intlw_squads). Its own job: either side failing
  # never stops the other.
  women:
    needs: changes
    if: needs.changes.outputs.intl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt pytest
      - name: Tests
        run: python -m pytest -q scripts/test_intl_squads.py
      - name: Import squads (women)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: scripts
        run: python intl_squads.py --women
