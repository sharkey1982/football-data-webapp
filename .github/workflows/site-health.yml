name: Live site health

# Checks the DEPLOYED site, not the build. Every generation step in the
# Netlify build exits 0 by design, so a deploy can succeed while missing its
# sitemap or every team page -- exactly what happened before 2026-09-25
# (/sitemap.xml, /football/teams/arsenal and /finance all 404 live). This job
# is the alarm: it fails, and GitHub emails the failure.
#
# Runs after the 07:00 UTC rebuild has had time to finish. No Netlify
# credits used -- it only reads the public site.

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: 'Fetch from this host instead (e.g. a deploy preview URL); canonicals are still checked against fixtureshark.com'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The canonical domain since 27 Sep 2026. The old netlify.app host now
      # 301s everything here, so checking it proved nothing.
      SITE: https://fixtureshark.com
      BASE: ${{ inputs.base }}
    steps:
      - name: Check sitemap, key pages and a sample of sitemap URLs
        run: |
          python3 - <<'PY'
          import os, random, re, sys, urllib.request, urllib.error
          site = os.environ["SITE"]
          base = (os.environ.get("BASE") or site).rstrip("/")
          fails = []

          # Redirects are NOT followed: a sitemap or canonical URL that 301s
          # is itself the failure. Following them silently is how every
          # sitemap URL 301ing to its trailing-slash form went unnoticed
          # (2026-09-28). Headers are kept so X-Robots-Tag can be checked.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None
          opener = urllib.request.build_opener(NoRedirect)

          def fetch(path):
              url = path if path.startswith("http") else site + path
              if base != site and url.startswith(site):
                  url = base + url[len(site):]
              req = urllib.request.Request(url, headers={"User-Agent": "FixtureShark-site-health"})
              try:
                  with opener.open(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace"), dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code, "", dict(e.headers or {})
              except Exception as e:
                  return 0, str(e), {}

          def get(path):
              s, body, headers = fetch(path)
              # Deploy previews always send noindex; only the live site is checked for it.
              if s == 200 and base == site and "noindex" in (headers.get("X-Robots-Tag") or headers.get("x-robots-tag") or "").lower():
                  fails.append(f"{path} sends X-Robots-Tag: noindex")
              return s, body

          status, body = get("/sitemap.xml")
          locs = re.findall(r"<loc>([^<]+)</loc>", body) if status == 200 else []
          # /sitemap.xml is a sitemap index (one file per section) since 6 Oct 2026.
          per_file = {}
          if status == 200 and "<sitemapindex" in body:
              files, locs = locs, []
              for f in files:
                  fs, fbody = get(f)
                  if fs != 200:
                      fails.append(f"{f} returned {fs}")
                      continue
                  n = re.findall(r"<loc>([^<]+)</loc>", fbody)
                  print(f"  {f}: {len(n)} URLs")
                  per_file[f.rsplit("/", 1)[-1].removesuffix(".xml")] = len(n)
                  locs += n
          print(f"sitemap.xml: HTTP {status}, {len(locs)} URLs")
          print(f"::notice::sitemap {len(locs)} URLs: " + ", ".join(f"{k} {v}" for k, v in per_file.items()))
          if status != 200:
              fails.append(f"/sitemap.xml returned {status}")
          dupes = len(locs) - len(set(locs))
          if dupes:
              fails.append(f"{dupes} duplicate URL(s) in the sitemap")
          if any("?" in u for u in locs):
              fails.append("sitemap contains parameterised URLs")
          elif len(locs) < 1000:
              fails.append(f"sitemap has only {len(locs)} URLs (expected 1000+) -- a section is missing")
          wrong_host = [u for u in locs if not u.startswith(site + "/")]
          if wrong_host:
              fails.append(f"{len(wrong_host)} sitemap URL(s) not on {site}, e.g. {wrong_host[0]}")

          # Pages that must exist. Team and finance pages are the ones that
          # vanished when static generation didn't finish.
          must = ["/", "/fixtures", "/tv-guide", "/affiliate-disclosure", "/finance", "/football/teams/arsenal",
                  "/football", "/fpl", "/fpl/line-ups", "/robots.txt",
                  "/nfl", "/nfl/teams/buffalo-bills", "/tennis", "/tennis/players/atp/sinner-j",
                  "/international", "/football/local-clubs"]
          for p in must:
              s, html = get(p)
              print(f"{p}: HTTP {s}")
              if s != 200:
                  fails.append(f"{p} returned {s}")
              elif p != "/robots.txt":
                  # The canonical must name the URL that was requested; one
                  # pointing elsewhere (or at a redirecting variant) tells
                  # Google not to index this page.
                  m = re.search(r'<link rel="canonical" href="([^"]+)"', html)
                  want = site + (p if p != "/" else "/")
                  if m and m.group(1).rstrip("/") != want.rstrip("/"):
                      fails.append(f"{p} canonical is {m.group(1)}, expected {want}")
                  if re.search(r'<meta[^>]+name="robots"[^>]+noindex', html):
                      fails.append(f"{p} has a noindex meta tag in raw HTML")

          # The trailing-slash form must redirect TO the canonical, not the
          # other way round.
          s, _, h = fetch("/fixtures/")
          loc = h.get("Location") or h.get("location") or ""
          print(f"/fixtures/: HTTP {s} -> {loc}")
          if s not in (301, 308) or loc.rstrip("/").split("fixtureshark.com")[-1] != "/fixtures":
              fails.append(f"/fixtures/ should 301 to /fixtures, got {s} {loc}")

          # A generated team page must carry real content in the raw HTML,
          # not just an empty React root (that would mean it was served by
          # the SPA fallback because generation failed).
          for p in ["/football/teams/arsenal", "/nfl/teams/buffalo-bills", "/tennis/players/atp/sinner-j",
                    "/international/teams/england", "/international/tournaments/world-cup/2022",
                    "/football/local-clubs"]:
              s, html = get(p)
              if s == 200 and re.search(r'<div id="root">\s*</div>', html):
                  fails.append(f"{p} has an empty root in raw HTML -- static generation did not write it")

          # Each section's sitemap file must be there and not shrunk to
          # nothing (a section that drops out of the build shows here).
          for section, floor in [("football", 1000), ("fpl", 300), ("finance", 10), ("nfl", 200), ("tennis", 150), ("international", 100)]:
              if per_file.get(section, 0) < floor:
                  fails.append(f"sitemap section {section} has {per_file.get(section, 0)} URLs (expected {floor}+)")

          random.seed()
          sample = random.sample(locs, min(30, len(locs)))
          bad = []
          # Always include one NFL game page: on 5-6 Oct sampled game pages
          # answered 301 while team pages were fine.
          games = [u for u in locs if "/nfl/games/" in u]
          if games:
              sample = sample + [random.choice(games)]
          for u in sample:
              s, body, h = fetch(u)
              if s != 200:
                  bad.append(f"{u} -> {s} {h.get('Location') or h.get('location') or ''}".rstrip())
                  continue
              # Indexability (7 Oct 2026 audit): every sitemap URL must name
              # itself canonical and carry no noindex in its server HTML.
              head = body.split("</head>")[0]
              m = re.search(r'<link rel="canonical" href="([^"]+)"', head)
              if not m:
                  bad.append(f"{u} has no canonical in server HTML")
              elif m.group(1) != u:
                  bad.append(f"{u} canonical is {m.group(1)}")
              if re.search(r'<meta[^>]+name="robots"[^>]+noindex', head):
                  bad.append(f"{u} is in the sitemap but noindex")
          print(f"sampled {len(sample)} sitemap URLs, {len(bad)} failed")
          fails += bad

          # One indexable address per page: host, scheme and case variants
          # must end (in at most 2 hops) at the https apex URL.
          def final(url, hops=3):
              for _ in range(hops):
                  s, _, h = fetch(url)
                  loc = h.get("Location") or h.get("location")
                  if s not in (301, 308) or not loc:
                      return s, url
                  url = loc if loc.startswith("http") else re.match(r"https?://[^/]+", url).group(0) + loc
              return s, url
          for variant, want in [("http://fixtureshark.com/football", site + "/football"),
                                ("https://www.fixtureshark.com/football", site + "/football"),
                                ("http://www.fixtureshark.com/football", site + "/football"),
                                (site + "/Football/Teams/Arsenal", site + "/football/teams/arsenal"),
                                (site + "/football/teams/arsenal/finances/", site + "/football/teams/arsenal/finances")]:
              if base != site and not variant.startswith(site):
                  continue
              s, end = final(variant)
              print(f"{variant} -> {s} {end}")
              if s != 200 or end != want:
                  fails.append(f"{variant} should redirect to {want}, ended {s} {end}")

          # Private paths stay blocked and out of the sitemap.
          _, robots = get("/robots.txt")
          for p in ["/admin/", "/login", "/data-health", "/source-data", "/data-flow"]:
              if f"Disallow: {p}" not in robots:
                  fails.append(f"robots.txt no longer blocks {p}")
              if any(u.startswith(site + p) for u in locs):
                  fails.append(f"sitemap lists a private path under {p}")

          if fails:
              print("\nFAILURES:")
              for f in fails:
                  print(" -", f)
                  print(f"::error::{f}")
              sys.exit(1)
          print("All checks passed.")
          PY
