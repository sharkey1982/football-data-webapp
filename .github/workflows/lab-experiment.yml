name: Model Lab

# Model Lab jobs, run by hand.
#
# f1: scores experiment F1 (market + Dixon-Coles pool; registered in
#   lab_experiments before it ran) and stores every result in lab_scorings.
#   Tuning and validation by default; the sealed holdout (2025/26, 2026/27)
#   only when open_holdout is ticked, and the database refuses a second
#   holdout scoring for the experiment. Needs the walk-forward forecasts
#   first: run "Model experiment" with experiment dc_walkforward_v1,
#   variants 180:0, seasons 6,7,8,9,10,11,12,13.
#
# f4: market-implied team ratings v Dixon-Coles for the projected final
#   table (registered in lab_experiments). Tuning (4 half-lives) and
#   validation; the holdout (2025/26) only when open_holdout is ticked.
#
# p5: market-rating team goals v Dixon-Coles as the FPL projection's team
#   input (registered in lab_experiments). No tuning, so the holdout can be
#   scored in the same run.
#
# p2: minutes after a start (exit bands: off before 60 / 60-84 / 85+),
#   registered in lab_experiments. Tuning (16 variants) and validation; with
#   open_holdout ticked, only the holdout, using the variant chosen on tuning.
#
# fpl_scoring_verify: the Python scoring engine (scripts/fpl_scoring.py)
#   against FPL's points for every 2026/27 player-match, using the database's
#   rule sets. Fails on any mismatch. (The SQL engine is checked daily by
#   check_model_integrity.)
#
# nfl_n0: NFL market benchmark (registered as N0): closing moneyline v
#   spread-implied win probability; fixes the NFL benchmark.
#
# nfl_n1: NFL margin-of-victory Elo (registered as N1) v the N0 benchmark and
#   a home-field baseline. Tuning (36 variants) and validation; with
#   open_holdout ticked, only the holdout (2025 + 2026), once, then concludes.
#
# analysis_squad_variance: one-off analysis, not an experiment (changes
#   nothing on the site). Next gameweek simulated 10,000 times: the optimal
#   XI, the next 49, a template and a differential XI against an
#   ownership-weighted field (chance of a top-1% week); and set-and-forget
#   2025/26 (how many fixed XIs came within 1/2/3/5% of the best). Writes
#   analysis_results.
#
# analysis_captain_partnerships: one-off analysis for the "one captain or
#   two?" article (changes nothing on the site). Rotation gain for every
#   possible second captain alongside Haaland, and exact squad solves
#   (forced-in pairs, budget curve) on the live projections, GW from-to.
#   Writes analysis_results (captain_partnerships).
#
# backtest_depth_floor: does wearing down a first choice's 85% start floor
#   when he is fit and not picked predict GW3-5 starts better? Rule and
#   decision fixed in the script before it ran. Writes analysis_results
#   (depth_floor_backtest).

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job
        type: choice
        options: [f1, f4, p5, p2, nfl_n0, nfl_n1, fpl_scoring_verify, analysis_squad_variance, analysis_captain_partnerships, backtest_depth_floor]
        default: f1
      open_holdout:
        description: "f1/f4/p5/p2/nfl_n1 only: score the sealed holdout (once only; p2 and nfl_n1 then score only the holdout)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt pytest
      - name: Unit tests (scoring engine)
        run: python -m pytest -q scripts/test_fpl_scoring.py
      - name: F1
        if: inputs.job == 'f1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/lab_f1.py ${{ inputs.open_holdout && '--open-holdout' || '' }}
      - name: F4
        if: inputs.job == 'f4'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/lab_f4.py ${{ inputs.open_holdout && '--open-holdout' || '' }}
      - name: P5
        if: inputs.job == 'p5'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/lab_p5.py ${{ inputs.open_holdout && '--open-holdout' || '' }}
      - name: P2
        if: inputs.job == 'p2'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/lab_p2.py ${{ inputs.open_holdout && '--holdout-only' || '' }}
      - name: NFL N0
        if: inputs.job == 'nfl_n0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/lab_nfl.py n0
      - name: NFL N1
        if: inputs.job == 'nfl_n1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/lab_nfl.py n1 ${{ inputs.open_holdout && '--open-holdout' || '' }}
      - name: FPL scoring engine v FPL's points
        if: inputs.job == 'fpl_scoring_verify'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fpl_scoring.py --verify --season-id 13
      - name: Squad variance analysis
        if: inputs.job == 'analysis_squad_variance'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analysis_squad_variance.py --part both
      - uses: actions/setup-node@v4
        if: inputs.job == 'analysis_captain_partnerships'
        with:
          node-version: '22'
      - name: Captain partnerships analysis
        if: inputs.job == 'analysis_captain_partnerships'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          set +e
          { npm install --no-save --no-audit --no-fund && npx tsx scripts/analysis_captain_partnerships.ts --from 6 --to 15; } 2>&1 | tee /tmp/cp.log
          STATUS=${PIPESTATUS[0]}
          # Logs can't be read from a cloud session; annotations can.
          ENCODED=$(tail -c 3000 /tmp/cp.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/\r/%0D/g')
          if [ "$STATUS" -ne 0 ]; then echo "::error::$ENCODED"; else echo "::notice::$ENCODED"; fi
          exit $STATUS
      - name: Depth floor backtest
        if: inputs.job == 'backtest_depth_floor'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set +e
          python -m pytest -q scripts/test_fpl_depth_chart.py 2>&1 | tail -3 | tee /tmp/bt.log
          python scripts/backtest_depth_floor.py 2>&1 | tee -a /tmp/bt.log
          STATUS=${PIPESTATUS[0]}
          ENCODED=$(tail -c 3000 /tmp/bt.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/\r/%0D/g')
          if [ "$STATUS" -ne 0 ]; then echo "::error::$ENCODED"; else echo "::notice::$ENCODED"; fi
          exit $STATUS
