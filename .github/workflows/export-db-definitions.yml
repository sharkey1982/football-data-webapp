name: Export database definitions

# Snapshots every live view and function into supabase/definitions/ and opens
# a PR if anything differs from what's committed. Weekly, it doubles as a
# drift report: a live change that was never put in a migration shows up
# as a diff here. Workflow/definitions-only changes: Netlify skips the build.
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 1' # Mondays 05:35 UTC

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: export-db-definitions
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Export definitions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/export_db_definitions.py
      - name: Export data catalogue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/export_catalogue.py
      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard supabase/definitions)" ]; then
            echo "No changes -- live definitions match the repo."
            exit 0
          fi
          BRANCH="db-definitions-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add supabase/definitions docs/catalogue.md
          git commit -m "Export live database definitions and catalogue ($(date -u +%Y-%m-%d))"
          git push origin "$BRANCH"
          BODY="Automated export of every live view and function (scripts/export_db_definitions.py) and the data catalogue (scripts/export_catalogue.py -> docs/catalogue.md). A definitions diff means the live database differs from the last committed export -- check it was intended and recorded in a migration. A changed definition whose catalogue entry did not change needs its entry re-reviewed (see meta_catalogue_gaps)."
          # GitHub blocks Actions from opening PRs unless the repo setting
          # "Allow GitHub Actions to create and approve pull requests" is on.
          # If it's off, open an issue linking the pushed branch instead, so
          # a drift report is never silently lost.
          if ! gh pr create --base main --head "$BRANCH" --title "Database definitions export $(date -u +%Y-%m-%d)" --body "$BODY"; then
            gh issue create --title "Database definitions changed $(date -u +%Y-%m-%d) -- review branch $BRANCH" \
              --body "$BODY

          Actions isn't allowed to open PRs in this repo, so the export is on branch \`$BRANCH\`.
          Review: ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH"
          fi
