name: Hindsight Optimal Squad

# Runs after the daily projection refresh so a newly-completed gameweek's
# real results are picked up promptly, plus manual trigger for on-demand
# recompute (e.g. right after testing/validating the script itself).
on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Audit P-07: start time for this run's pipeline_runs row (Log run).
      - run: echo "RUN_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install

      - name: Solve hindsight-optimal squad
        shell: bash
        run: |
          set +e
          npm run hindsight:solve 2>&1 | tee /tmp/hindsight.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            ENCODED=$(tail -c 3000 /tmp/hindsight.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/\r/%0D/g')
            echo "::error::$ENCODED"
          fi
          exit $STATUS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Audit P-07 (22 Oct 2026): one pipeline_runs row per run, so
      # job_health sees a failed or missing run (job_registry run_key
      # ^hindsight_optimal$). Never fails the job.
      - name: Log run
        if: always()
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOB_STATUS: ${{ job.status }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - > /tmp/pipeline_run.json <<'PY'
          import datetime, json, os
          status = "success" if os.environ["JOB_STATUS"] == "success" else "failed"
          print(json.dumps({
              "job_name": "hindsight_optimal",
              "status": status,
              "started_at": os.environ.get("RUN_T0") or None,
              "finished_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "summary": f"{os.environ['EVENT']} run, job {os.environ['JOB_STATUS']}: {os.environ['RUN_URL']}",
          }))
          PY
          curl -s -o /dev/null -w "pipeline_runs insert: HTTP %{http_code}\n" --max-time 20 -X POST "$SUPABASE_URL/rest/v1/pipeline_runs" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" -d @/tmp/pipeline_run.json || true
