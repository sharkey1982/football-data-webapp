name: Daily International Import (Big 5, non-English)

# Deliberately its own workflow file, not folded into daily-import.yml's
# loop, per an explicit decision: these four leagues are less central to
# the site than the English pyramid, so a source hiccup or a new season's
# team-alias gap here should never be able to fail or block the English
# import -- they're isolated at the workflow level, not just the
# per-league try/continue level already used inside each loop.
#
# Results only -- no Dixon-Coles fitting, no prediction refresh. Per an
# explicit instruction: ingest the factual data first, decide separately
# and later whether/how it feeds into any prediction calculations. Adding
# a fit step for these leagues is a deliberate future decision, not an
# oversight here.
#
# No fixture-sync step either: these leagues have no `fixtures` table
# rows at all yet (only `matches`, the completed-results archive), so
# there's nothing for sync:fixtures to do for them -- see
# scripts/sync-fixtures.ts's own EC-specific scope.

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      # Same per-league isolation pattern as the English import loop: one
      # country's source hiccup or a not-yet-covered promoted team must
      # not stop the other three from updating.
      - name: Import daily results (Bundesliga, Serie A, Ligue 1, La Liga)
        run: |
          set +e
          FAILED=0
          for LEAGUE in D1 I1 F1 SP1; do
            echo "::group::Importing $LEAGUE"
            IMPORT_LEAGUE_CODE="$LEAGUE" IMPORT_CSV_URL="https://football-data.co.uk/mmz4281/2627/$LEAGUE.csv" IMPORT_SEASON_LABEL="2627" npm run import:daily
            if [ $? -ne 0 ]; then
              echo "::error::Import failed for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
