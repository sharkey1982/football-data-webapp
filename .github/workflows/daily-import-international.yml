name: Daily International Import (non-English top flights)

# Deliberately its own workflow file, not folded into daily-import.yml's
# loop, per an explicit decision: these four leagues are less central to
# the site than the English pyramid, so a source hiccup or a new season's
# team-alias gap here should never be able to fail or block the English
# import -- they're isolated at the workflow level, not just the
# per-league try/continue level already used inside each loop.
#
# Results for all of these. Dixon-Coles fits and predictions ONLY for the
# leagues that passed Model Lab experiment E1 (docs/experiments.md) and
# Chris approved for the site (25 Oct 2026): Serie A (I1) and the Scottish
# Premiership (SC0). La Liga, the Bundesliga and Ligue 1 failed E1 and are
# not fitted. Adding a league here needs its own Model Lab pass first.
#
# No fixture-sync step either: these leagues have no `fixtures` table
# rows at all yet (only `matches`, the completed-results archive), so
# there's nothing for sync:fixtures to do for them -- see
# scripts/sync-fixtures.ts's own EC-specific scope.

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install

      # Same per-league isolation pattern as the English import loop: one
      # country's source hiccup or a not-yet-covered promoted team must
      # not stop the other three from updating.
      - name: Import daily results (non-English top flights)
        run: |
          set +e
          FAILED=0
          # 3-letter codes are football-data.co.uk's "extra league" files
          # (all seasons in one file); the importer derives each URL from
          # the code and keeps only this season's rows.
          for LEAGUE in D1 I1 F1 SP1 P1 B1 T1 G1 N1 SC0 AUT DNK NOR POL ROU SWE SWZ FIN; do
            echo "::group::Importing $LEAGUE"
            # Season = public.current_season_id() (docs/season-rollover.md).
            IMPORT_LEAGUE_CODE="$LEAGUE" npm run import:daily
            if [ $? -ne 0 ]; then
              echo "::error::Import failed for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - uses: actions/setup-python@v6
        if: always()
        with:
          python-version: '3.12'
      - if: always()
        run: pip install -r scripts/requirements.txt

      # Fit (dc_v1_1, same script and quality gates as the English leagues;
      # a rejected fit is written for audit and never used), then estimate
      # any club without a direct rating. Their divisions below aren't
      # loaded, so a promoted club gets the average rating of last season's
      # relegated clubs (--relegated-proxy), marked is_estimated. Each
      # league is independent of the other.
      - name: Fit and estimate (I1, SC0)
        if: always()
        run: |
          set +e
          FAILED=0
          for LEAGUE in I1 SC0; do
            echo "::group::Fitting $LEAGUE"
            python scripts/fit_dixon_coles.py --league-code "$LEAGUE"
            if [ $? -ne 0 ]; then
              echo "::error::Fit failed or was rejected for $LEAGUE"
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
            echo "::group::Estimating unrated clubs for $LEAGUE"
            python scripts/estimate_promoted_team_ratings.py --target-league "$LEAGUE" --relegated-proxy
            RC=$?
            if [ $RC -eq 2 ]; then
              echo "::warning::$LEAGUE has club(s) with no rating and no estimation basis -- see the output"
            elif [ $RC -ne 0 ]; then
              echo "::error::Estimation failed for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Puts every league's newest accepted fit onto its upcoming fixtures
      # (league-agnostic; the English import runs it too, at 06:00).
      - name: Refresh fixture predictions
        if: always()
        run: npm run predictions:refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
