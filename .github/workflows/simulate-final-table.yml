name: Simulate Final Table

# Manual trigger -- runs scripts/simulate_final_table.py, populating
# team_finishing_position_projection for every league-type competition.
# Run this whenever team ratings or fixture predictions change materially
# (a new Dixon-Coles fit, a Team Strength manual override, a batch of
# results processed).
on:
  workflow_dispatch:
    inputs:
      season_id:
        description: 'Season ID (blank = current season)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt

      - name: Refresh market team goals
        continue-on-error: true
        run: python scripts/refresh_market_goals.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Simulate final table
        run: python scripts/simulate_final_table.py ${IN_SEASON_ID:+--season-id "$IN_SEASON_ID"}
        env:
          IN_SEASON_ID: ${{ inputs.season_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
