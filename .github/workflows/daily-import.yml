name: Daily Premier League Import

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: pip install -r scripts/requirements.txt

      # Step 1: import today's completed E0 results. (Only E0 has a daily
      # results source configured today -- E1-EC fit on whatever match
      # data already exists in the DB.)
      - name: Import daily results
        run: npm run import:daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Steps 2-3: refit every competition and estimate its promoted teams
      # from the division below, via one generic loop rather than
      # duplicated per-league steps -- see scripts/fit_dixon_coles.py and
      # scripts/estimate_promoted_team_ratings.py, both already
      # competition-agnostic. Each league's fit+estimate pair is
      # independent of every other league's: a problem specific to one
      # competition (its own fit rejected, or its promoted-team
      # estimation hitting a case it can't resolve) must not prevent a
      # completely unrelated competition from being fitted at all. The
      # job still fails overall (FAILED=1 -> exit 1) if ANY competition's
      # fit or estimation step failed, so nothing is silently swallowed --
      # it just doesn't take the rest of the pyramid down with it.
      # EC (National League) has no division below in this dataset, so it
      # has no estimation step.
      - name: Fit Dixon-Coles models and estimate promoted teams (all competitions)
        run: |
          set +e
          FAILED=0
          declare -A SOURCE_LEAGUE=( [E0]=E1 [E1]=E2 [E2]=E3 [E3]=EC )
          for LEAGUE in E0 E1 E2 E3 EC; do
            echo "::group::Fitting $LEAGUE"
            python scripts/fit_dixon_coles.py --league-code "$LEAGUE"
            if [ $? -ne 0 ]; then
              echo "::error::Fit failed or was rejected for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"

            SRC="${SOURCE_LEAGUE[$LEAGUE]:-}"
            if [ -n "$SRC" ]; then
              echo "::group::Estimating promoted teams for $LEAGUE from $SRC"
              python scripts/estimate_promoted_team_ratings.py --target-league "$LEAGUE" --source-league "$SRC"
              if [ $? -ne 0 ]; then
                echo "::error::Promoted-team estimation failed for $LEAGUE (from $SRC)"
                FAILED=1
              fi
              echo "::endgroup::"
            fi
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Step 4: push each competition's accepted fit's predictions onto its
      # upcoming fixtures -- runs even if step 2-3 had a per-league
      # problem, since every OTHER competition's good fit should still
      # reach production; the job as a whole is still marked failed above.
      - name: Refresh fixture predictions
        if: always()
        run: npm run predictions:refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
