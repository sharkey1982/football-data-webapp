name: Daily Premier League Import

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      rebuild_site:
        description: 'Rebuild the site afterwards (a production deploy: 15 Netlify credits)'
        required: false
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: pip install -r scripts/requirements.txt

      # Step 1: import today's completed results for every division that
      # has a daily source configured -- previously E0 only, which meant
      # E1-EC's match data (and, transitively, their model fits) never
      # actually advanced day to day even though the fit step below has
      # always looped over all five. Same per-league isolation pattern as
      # the fit step: one division's import failing (a malformed row, a
      # source hiccup) must not block the others from updating.
      - name: Import daily results (all divisions)
        run: |
          set +e
          FAILED=0
          for LEAGUE in E0 E1 E2 E3 EC; do
            echo "::group::Importing $LEAGUE"
            IMPORT_LEAGUE_CODE="$LEAGUE" IMPORT_CSV_URL="https://football-data.co.uk/mmz4281/2627/$LEAGUE.csv" IMPORT_SEASON_LABEL="2627" npm run import:daily
            if [ $? -ne 0 ]; then
              echo "::error::Import failed for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Also archive each file's new raw rows in source_match_rows and run
          # backfill_match_odds(), so bookmaker odds arrive with the results.
          # Before 26 Sep 2026 nothing did this and match_odds stopped at the
          # one-off raw backfill of 11 Sep (see docs/incidents.md).
          IMPORT_ARCHIVE_ODDS: '1'

      # EC fixtures: no step here since 2026-09-26. The old "Sync EC
      # fixtures" step (scripts/sync-fixtures.ts) read football-data.co.uk
      # fixtures.csv, which only ever holds the next few days, so EC had 36
      # of 552 fixtures. The full season is now kept by
      # public.refresh_national_league_fixtures() (pg_cron, 04:35 UTC);
      # running both would let two sources overwrite each other's kick-off
      # times. See docs/incidents.md.

      # Steps 2-3: refit every competition and estimate its promoted AND
      # relegated teams from the adjacent divisions, via one generic loop
      # rather than duplicated per-league steps -- see
      # scripts/fit_dixon_coles.py and scripts/estimate_promoted_team_ratings.py,
      # both competition-agnostic. Promoted (--below-league) and relegated
      # (--above-league) teams are NOT mirror images of each other -- see
      # the estimator's own docstring for the real analysis behind that --
      # so each league's estimation step is given whichever adjacent
      # division(s) actually exist for it.
      #
      # Runs even if the import step above had a per-league failure
      # (if: always()) -- that step's own internal per-league isolation
      # means its overall exit code doesn't tell you which leagues are
      # actually fine, only that at least one wasn't. A division whose
      # import failed today just refits on yesterday's data here, same
      # as before this loop existed; the other four still advance rather
      # than the whole step being skipped over one division's problem.
      #
      # Each league's fit+estimate pair is independent of every other
      # league's: a problem specific to one competition must not prevent a
      # completely unrelated competition from being fitted. The job still
      # fails overall (FAILED=1 -> exit 1) if ANY competition's fit or
      # estimation step failed, so nothing is silently swallowed -- it
      # just doesn't take the rest of the pyramid down with it.
      - name: Fit Dixon-Coles models and estimate promoted/relegated teams (all competitions)
        if: always()
        run: |
          set +e
          FAILED=0
          declare -A BELOW_LEAGUE=( [E0]=E1 [E1]=E2 [E2]=E3 [E3]=EC )
          declare -A ABOVE_LEAGUE=( [E1]=E0 [E2]=E1 [E3]=E2 [EC]=E3 )
          for LEAGUE in E0 E1 E2 E3 EC; do
            echo "::group::Fitting $LEAGUE"
            python scripts/fit_dixon_coles.py --league-code "$LEAGUE"
            if [ $? -ne 0 ]; then
              echo "::error::Fit failed or was rejected for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"

            BELOW="${BELOW_LEAGUE[$LEAGUE]:-}"
            ABOVE="${ABOVE_LEAGUE[$LEAGUE]:-}"
            if [ -n "$BELOW" ] || [ -n "$ABOVE" ]; then
              ARGS="--target-league $LEAGUE"
              [ -n "$BELOW" ] && ARGS="$ARGS --below-league $BELOW"
              [ -n "$ABOVE" ] && ARGS="$ARGS --above-league $ABOVE"
              echo "::group::Estimating promoted/relegated teams for $LEAGUE ($ARGS)"
              python scripts/estimate_promoted_team_ratings.py $ARGS
              EST_EXIT=$?
              if [ $EST_EXIT -eq 2 ]; then
                # Exit 2 = some team(s) genuinely have no rating basis yet
                # (not enough match history in either this division or the
                # adjacent one -- expected for a newly-tracked team, not a
                # bug). Every OTHER team's estimate this run still wrote
                # successfully. Flagged, not treated as a pipeline failure.
                echo "::warning::Promoted/relegated-team estimation for $LEAGUE had unresolvable team(s) -- see the run's own output for which"
              elif [ $EST_EXIT -ne 0 ]; then
                echo "::error::Promoted/relegated-team estimation failed for $LEAGUE"
                FAILED=1
              fi
              echo "::endgroup::"
            fi
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Step 4: push each competition's accepted fit's predictions onto its
      # upcoming fixtures -- runs even if step 2-3 had a per-league
      # problem, since every OTHER competition's good fit should still
      # reach production; the job as a whole is still marked failed above.
      - name: Refresh fixture predictions
        if: always()
        run: npm run predictions:refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Regenerates the static pages so they reflect the data this run
      # just produced. Without this, every prerendered page keeps showing
      # whatever was true at the last DEPLOY -- and since those pages now
      # publish "Projections updated <timestamp>" and a model version,
      # stale content would make the freshness claims actively wrong
      # rather than merely old.
      #
      # Runs even if an earlier step failed (if: always()): the pipeline
      # writes to the database step by step, so a partial run still
      # advanced real data that the site should show.
      #
      # No-ops silently when NETLIFY_BUILD_HOOK_URL isn't configured, so
      # this is safe to have in place before the secret exists. The hook
      # URL is low-privilege -- it can start a build and nothing else --
      # which is why it's used here in preference to a Netlify API token.
      #
      # NOT ON SCHEDULE (2026-09-23): the FPL pipeline's 07:00 run rebuilds the
      # site an hour later with this run's data included, so rebuilding here
      # too cost 15 Netlify credits a day for nothing. Manual runs can still
      # ask for a rebuild with rebuild_site.
      - name: Trigger site rebuild
        if: always() && github.event.inputs.rebuild_site == 'true'
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK_URL }}" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK_URL not set -- skipping rebuild. Static pages will refresh on the next deploy."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_URL }}")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Rebuild triggered (HTTP $STATUS)."
          else
            # Deliberately not fatal: the data work succeeded, and failing
            # the whole run over a rebuild trigger would misreport that.
            echo "::warning::Rebuild trigger returned HTTP $STATUS"
          fi
