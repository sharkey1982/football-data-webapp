name: Daily Premier League Import

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: pip install -r scripts/requirements.txt

      # Step 1: import today's completed results for every division that
      # has a daily source configured -- previously E0 only, which meant
      # E1-EC's match data (and, transitively, their model fits) never
      # actually advanced day to day even though the fit step below has
      # always looped over all five. Same per-league isolation pattern as
      # the fit step: one division's import failing (a malformed row, a
      # source hiccup) must not block the others from updating.
      - name: Import daily results (all divisions)
        run: |
          set +e
          FAILED=0
          for LEAGUE in E0 E1 E2 E3 EC; do
            echo "::group::Importing $LEAGUE"
            IMPORT_LEAGUE_CODE="$LEAGUE" IMPORT_CSV_URL="https://football-data.co.uk/mmz4281/2627/$LEAGUE.csv" IMPORT_SEASON_LABEL="2627" npm run import:daily
            if [ $? -ne 0 ]; then
              echo "::error::Import failed for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Root cause of the earlier silent crash found and fixed: fixtures.slug
      # is NOT NULL with no default and no trigger, so any insert of a
      # genuinely new fixture (which is this script's whole purpose) threw
      # a constraint violation. Fixed at the table level with a trigger
      # (auto-generates the slug on insert, so every insert path benefits,
      # not just this one) and verified directly -- re-tested live via the
      # same mechanism that surfaced the original bug. Scoped to EC only
      # now (see the script's own header): refresh_fixture_feeds() already
      # keeps E0-E3 and the Europeans current, this fills the one gap it
      # structurally can't (inserting fixtures that don't exist yet).
      - name: Sync EC fixtures (insert new ones; refresh_fixture_feeds covers updates elsewhere)
        if: always()
        run: npm run sync:fixtures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Steps 2-3: refit every competition and estimate its promoted AND
      # relegated teams from the adjacent divisions, via one generic loop
      # rather than duplicated per-league steps -- see
      # scripts/fit_dixon_coles.py and scripts/estimate_promoted_team_ratings.py,
      # both competition-agnostic. Promoted (--below-league) and relegated
      # (--above-league) teams are NOT mirror images of each other -- see
      # the estimator's own docstring for the real analysis behind that --
      # so each league's estimation step is given whichever adjacent
      # division(s) actually exist for it.
      #
      # Runs even if the import step above had a per-league failure
      # (if: always()) -- that step's own internal per-league isolation
      # means its overall exit code doesn't tell you which leagues are
      # actually fine, only that at least one wasn't. A division whose
      # import failed today just refits on yesterday's data here, same
      # as before this loop existed; the other four still advance rather
      # than the whole step being skipped over one division's problem.
      #
      # Each league's fit+estimate pair is independent of every other
      # league's: a problem specific to one competition must not prevent a
      # completely unrelated competition from being fitted. The job still
      # fails overall (FAILED=1 -> exit 1) if ANY competition's fit or
      # estimation step failed, so nothing is silently swallowed -- it
      # just doesn't take the rest of the pyramid down with it.
      - name: Fit Dixon-Coles models and estimate promoted/relegated teams (all competitions)
        if: always()
        run: |
          set +e
          FAILED=0
          declare -A BELOW_LEAGUE=( [E0]=E1 [E1]=E2 [E2]=E3 [E3]=EC )
          declare -A ABOVE_LEAGUE=( [E1]=E0 [E2]=E1 [E3]=E2 [EC]=E3 )
          for LEAGUE in E0 E1 E2 E3 EC; do
            echo "::group::Fitting $LEAGUE"
            python scripts/fit_dixon_coles.py --league-code "$LEAGUE"
            if [ $? -ne 0 ]; then
              echo "::error::Fit failed or was rejected for $LEAGUE"
              FAILED=1
            fi
            echo "::endgroup::"

            BELOW="${BELOW_LEAGUE[$LEAGUE]:-}"
            ABOVE="${ABOVE_LEAGUE[$LEAGUE]:-}"
            if [ -n "$BELOW" ] || [ -n "$ABOVE" ]; then
              ARGS="--target-league $LEAGUE"
              [ -n "$BELOW" ] && ARGS="$ARGS --below-league $BELOW"
              [ -n "$ABOVE" ] && ARGS="$ARGS --above-league $ABOVE"
              echo "::group::Estimating promoted/relegated teams for $LEAGUE ($ARGS)"
              python scripts/estimate_promoted_team_ratings.py $ARGS
              if [ $? -ne 0 ]; then
                echo "::error::Promoted/relegated-team estimation failed for $LEAGUE"
                FAILED=1
              fi
              echo "::endgroup::"
            fi
          done
          exit $FAILED
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Step 4: push each competition's accepted fit's predictions onto its
      # upcoming fixtures -- runs even if step 2-3 had a per-league
      # problem, since every OTHER competition's good fit should still
      # reach production; the job as a whole is still marked failed above.
      - name: Refresh fixture predictions
        if: always()
        run: npm run predictions:refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
