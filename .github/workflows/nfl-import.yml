name: NFL import (nflverse games and team names)

# Daily NFL load -- see scripts/nfl_import.py. Separate from the football
# imports on purpose. 06:20 UTC: after Monday Night Football has finished and
# before the 07:00 FPL run rebuilds the site, so the static NFL pages carry
# the latest results, then the latest season's player stats; then the model's
# predictions for the next 8 days (scripts/nfl_elo.py, append-only); then the
# Player Projections's fantasy projections (scripts/nfl_projections.py). Writes
# pipeline_runs rows (job_name nfl_import, nfl_elo, nfl_projections).

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Game seasons, comma-separated (blank = all from 2002)'
        required: false
        default: ''
      player_seasons:
        description: 'Player-stat seasons, e.g. 2016-2026 (blank = latest season only)'
        required: false
        default: ''
      team_seasons:
        description: 'Team-stat seasons, e.g. 2002-2026 (blank = the player seasons, or latest)'
        required: false
        default: ''
      snap_seasons:
        description: 'Snap-count seasons, e.g. 2013-2026 (blank = latest)'
        required: false
        default: ''
      depth_seasons:
        description: 'Depth-chart seasons to reload in full, e.g. 2016-2026 (blank = latest, last few days)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEASONS: ${{ inputs.seasons }}
          PLAYER_SEASONS: ${{ inputs.player_seasons }}
          TEAM_SEASONS: ${{ inputs.team_seasons }}
          SNAP_SEASONS: ${{ inputs.snap_seasons }}
          DEPTH_SEASONS: ${{ inputs.depth_seasons }}
        run: python scripts/nfl_import.py --seasons "$SEASONS" --player-seasons "$PLAYER_SEASONS" --team-seasons "$TEAM_SEASONS" --snap-seasons "$SNAP_SEASONS" --depth-seasons "$DEPTH_SEASONS"
      - name: Model predictions (Elo, experiment N1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/nfl_elo.py
      - name: Fantasy projections (Player Projections, experiment NP1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/nfl_projections.py
