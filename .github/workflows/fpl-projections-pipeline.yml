name: FPL Projections Pipeline

# Scheduled twice daily (07:00 and 19:00 UTC -- after daily-import's 06:00
# run and hindsight-optimal's 06:45 have both had time to complete, then
# again roughly 12h later to catch injury news/team-news updates through
# the day) plus manual dispatch for an on-demand re-run or a specific
# matchweek range.
#
# Replaces the previously-separate, always-manual Refresh FPL Projections /
# Simulate Fixture Bonus / Simulate Final Table workflows' SCHEDULING --
# those three scripts are unchanged and still exist standalone for a
# targeted one-off run, but routine operation now happens here.
#
# Runs the two-pass order confirmed directly from
# refresh_fpl_projection_fixture_v6's own source: it falls back to an
# older, less accurate closed-form bonus estimate when
# fpl_fixture_bonus_montecarlo_v1 has nothing for a fixture yet, so
# refreshing once, simulating bonus from THAT pass's goals/assists, then
# refreshing again is what actually produces the more accurate number --
# not just a safety measure against ordering errors.
on:
  schedule:
    # Two entries (not '41 6,18') so the rebuild step can tell the morning
    # run apart: only the morning run rebuilds the site -- see "Trigger site
    # rebuild".
    #
    # Off the hour (2026-09-25): at '0 7'/'0 19' GitHub was starting these
    # 3-5.5 hours late (12:40 / 21:52 UTC) -- top-of-hour schedules queue
    # behind everyone else's. :41 also avoids the :17/:23 FPL pg_cron jobs.
    - cron: '41 6 * * *'
    - cron: '41 18 * * *'
  workflow_dispatch:
    inputs:
      rebuild_site:
        description: 'Rebuild the site afterwards (a production deploy: 15 Netlify credits)'
        required: false
        type: boolean
        default: false
      from_matchweek:
        description: 'First matchweek (leave blank to auto-detect the next gameweek)'
        required: false
        type: string
      to_matchweek:
        description: 'Last matchweek (leave blank to auto-detect a 10-gameweek window)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt

      # Manual dispatch can pin an exact range; the scheduled run (and a
      # manual dispatch left blank) auto-detects the next 10 gameweeks.
      # 10, not 3 (2026-10-05): Squad Check offers a 10-gameweek horizon and
      # availability now changes gameweek by gameweek (return dates, doubts
      # for the next gameweek only), but GW9+ had last been generated on
      # 26 Sep. A 10-week run took ~3 minutes on 26 Sep.
      - name: Determine matchweek range
        id: range
        run: |
          if [ -n "${IN_FROM_MATCHWEEK}" ] && [ -n "${IN_TO_MATCHWEEK}" ]; then
            echo "from_matchweek=${IN_FROM_MATCHWEEK}" >> "$GITHUB_OUTPUT"
            echo "to_matchweek=${IN_TO_MATCHWEEK}" >> "$GITHUB_OUTPUT"
            echo "Using manually specified range: ${IN_FROM_MATCHWEEK}-${IN_TO_MATCHWEEK}"
          else
            python scripts/get_next_matchweek_range.py --weeks 10
          fi
        env:
          IN_FROM_MATCHWEEK: ${{ inputs.from_matchweek }}
          IN_TO_MATCHWEEK: ${{ inputs.to_matchweek }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Market expected goals onto upcoming fixtures (Model Lab F4/P5). The
      # projections below and the final-table simulation read them, falling
      # back to the model where absent -- so a failure here must not stop
      # the pipeline (it is still marked failed in pipeline_runs).
      - name: Refresh market team goals
        continue-on-error: true
        run: python scripts/refresh_market_goals.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # How each player's next start is likely to end (Model Lab P2): drives
      # appearance and clean-sheet points. Falls back to the old rule for
      # any player missing, so a failure here must not stop the pipeline.
      - name: Refresh exit bands
        continue-on-error: true
        run: python scripts/refresh_exit_bands.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Refresh FPL projections (pass 1 -- fallback bonus estimate)
        run: python scripts/refresh_fpl_projections.py --from-matchweek "${{ steps.range.outputs.from_matchweek }}" --to-matchweek "${{ steps.range.outputs.to_matchweek }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Direct connection: no 8-second API limit (2026-10-05).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Simulate fixture bonus
        run: python scripts/simulate_fixture_bonus.py --from-matchweek "${{ steps.range.outputs.from_matchweek }}" --to-matchweek "${{ steps.range.outputs.to_matchweek }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Refresh FPL projections (pass 2 -- picks up real Monte Carlo bonus)
        run: python scripts/refresh_fpl_projections.py --from-matchweek "${{ steps.range.outputs.from_matchweek }}" --to-matchweek "${{ steps.range.outputs.to_matchweek }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Direct connection: no 8-second API limit (2026-10-05).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Simulate final table
        run: python scripts/simulate_final_table.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Regenerates the static pages so they reflect the data this run
      # just produced. Without this, every prerendered page keeps showing
      # whatever was true at the last DEPLOY -- and since those pages now
      # publish "Projections updated <timestamp>" and a model version,
      # stale content would make the freshness claims actively wrong
      # rather than merely old.
      #
      # Only after a FULLY successful run (2026-09-25; previously
      # if: always()). Pass 1 replaces projections fixture by fixture, so a
      # run that dies part-way leaves some fixtures on the new generation
      # and the rest on the old one, with no bonus simulation or pass 2.
      # Rebuilding then publishes that mixture under a fresh "Projections
      # updated" timestamp, as happened on 2026-09-24 (run 36000353679,
      # Supabase 522 in pass 1). Skipping it keeps yesterday's consistent
      # pages up, costs no credits, and the next run repairs the data --
      # each fixture's refresh is idempotent.
      #
      # No-ops silently when NETLIFY_BUILD_HOOK_URL isn't configured, so
      # this is safe to have in place before the secret exists. The hook
      # URL is low-privilege -- it can start a build and nothing else --
      # which is why it's used here in preference to a Netlify API token.
      #
      # ONCE A DAY (2026-09-23): each rebuild is a production deploy costing 15
      # Netlify credits, and three a day (06:00, 07:00, 19:00) used ~1,350 of
      # the 3,000 monthly credits before any code shipped; the site was
      # suspended for running out. Only the 07:00 scheduled run rebuilds, or a
      # manual run with rebuild_site ticked. Pages are at most a day stale.
      - name: Trigger site rebuild
        if: success() && (github.event.schedule == '41 6 * * *' || github.event.inputs.rebuild_site == 'true')
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK_URL }}" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK_URL not set -- skipping rebuild. Static pages will refresh on the next deploy."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_URL }}")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Rebuild triggered (HTTP $STATUS)."
          else
            # Deliberately not fatal: the data work succeeded, and failing
            # the whole run over a rebuild trigger would misreport that.
            echo "::warning::Rebuild trigger returned HTTP $STATUS"
          fi
