name: Model integrity checks

# Daily, after the imports, fits and the status sync: runs
# public.check_model_integrity() (one guard per incident in docs/incidents.md),
# logs to pipeline_runs, and fails this run if any check fails.

on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read   # run_integrity_checks.py compares scheduled workflows with job_registry

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt pytest
      - run: python -m pytest -q scripts/test_run_integrity_checks.py
      - name: Run checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Direct connection: the API cuts every call at 8 s (57014 on 14-15 Oct).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/run_integrity_checks.py
