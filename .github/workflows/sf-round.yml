name: Shark Fantasy round

# Phase 3 prototype (design §1): manual dispatch, plus the weekly round of the
# `weekly` league on Sundays (deadline 12:00 UK, kick-off 15:00). Drives a universe through
# scripts/sf/run-round.ts with the service role: create a season, let the bots
# move, lock at the deadline, play and commit the round. Every step is safe to
# re-run: a round already locked or final is a no-op, and a result can never be
# written twice. The Sunday runs are at 11:05 and 12:05 UTC so that one of them
# follows the 12:00 UK deadline in summer time and in winter; the other finds
# the round still open (or already played) and does nothing.
on:
  schedule:
    - cron: '5 11,12 * * 0'
  workflow_dispatch:
    inputs:
      command:
        description: 'create | advance | season | bots | lock | play'
        required: true
        default: advance
      universe:
        description: 'Universe id'
        required: true
        default: test
      force:
        description: 'Lock before the deadline (test universes only; refused for a public one)'
        type: boolean
        default: false
      first_deadline:
        description: 'create: round 1 deadline, ISO (default: a week from now)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sf-round-${{ inputs.universe || 'weekly' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Audit P-07: start time for this run's pipeline_runs row (Log run).
      - run: echo "RUN_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run
        shell: bash
        run: |
          ARGS=("$CMD" --universe "$UNIVERSE")
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ -n "$FIRST_DEADLINE" ]; then ARGS+=(--first-deadline "$FIRST_DEADLINE"); fi
          npx tsx scripts/sf/run-round.ts "${ARGS[@]}"
        env:
          CMD: ${{ inputs.command || 'advance' }}
          UNIVERSE: ${{ inputs.universe || 'weekly' }}
          FORCE: ${{ inputs.force || false }}
          FIRST_DEADLINE: ${{ inputs.first_deadline || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Audit P-07 (22 Oct 2026): one pipeline_runs row per run, so
      # job_health sees a failed or missing run (job_registry run_key
      # ^sf_round$). Never fails the job.
      - name: Log run
        if: always()
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOB_STATUS: ${{ job.status }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - > /tmp/pipeline_run.json <<'PY'
          import datetime, json, os
          status = "success" if os.environ["JOB_STATUS"] == "success" else "failed"
          print(json.dumps({
              "job_name": "sf_round",
              "status": status,
              "started_at": os.environ.get("RUN_T0") or None,
              "finished_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "summary": f"{os.environ['EVENT']} run, job {os.environ['JOB_STATUS']}: {os.environ['RUN_URL']}",
          }))
          PY
          curl -s -o /dev/null -w "pipeline_runs insert: HTTP %{http_code}\n" --max-time 20 -X POST "$SUPABASE_URL/rest/v1/pipeline_runs" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" -d @/tmp/pipeline_run.json || true
