name: Retro-fit past seasons (point-in-time Dixon-Coles)

# Walks past seasons week by week, fitting the model AS OF each date
# (scripts/fit_dixon_coles.py --as-of), so every archived match can be
# predicted from a fit that only saw earlier results. The divisions above and
# below are fitted at the same dates so relegated and promoted teams get
# point-in-time estimates. Dates come from each season's fixtures
# (scripts/retrofit_plan.py). Every fit's stamp is verified before anything is
# predicted (retrofit_verify_and_predict.py).
#
# Idempotent: a date that already has an accepted retro-fit is skipped (so a
# division fitted as "above"/"below" for another is reused), and each match's
# prediction is (re)set to the newest eligible fit before it -- rerun freely.

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: Leagues to retro-fit, comma-separated (E0,E1,E2,E3,EC)
        default: E0
      seasons:
        description: season_ids, comma-separated (10 = 2023/24, 11 = 2024/25, 12 = 2025/26)
        default: '12'
      start_date:
        description: Optional first as-of date (blank = day before the first match)
        default: ''
      end_date:
        description: Optional last as-of date (blank = day before the last match)
        default: ''
      step_days:
        description: Days between fits
        default: '7'

concurrency:
  group: retrofit-season
  cancel-in-progress: false

jobs:
  retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt

      - name: Plan
        run: |
          python scripts/retrofit_plan.py --leagues "${{ inputs.leagues }}" --seasons "${{ inputs.seasons }}" \
            --step-days "${{ inputs.step_days }}" --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" | tee plan.txt

      # A rejected fit for one date is not fatal (the verify step reports it
      # and the previous week's fit serves those matches); an estimation error
      # or a verify failure fails the job at the end.
      - name: Fit, verify and predict
        run: |
          set +e
          FAILED=0
          fit() { python scripts/fit_dixon_coles.py --league-code "$1" --as-of "$2" > /tmp/fit.log 2>&1 || { echo "::warning::$1 fit as of $2 failed or was rejected"; tail -3 /tmp/fit.log; }; }
          while read -r LEAGUE SEASON ABOVE BELOW DATES; do
            case "$LEAGUE" in ''|\#*) continue;; esac
            echo "::group::$LEAGUE season $SEASON"
            for D in $(echo "$DATES" | tr ',' ' '); do
              [ "$ABOVE" != "-" ] && fit "$ABOVE" "$D"
              [ "$BELOW" != "-" ] && fit "$BELOW" "$D"
              fit "$LEAGUE" "$D"
              ARGS=""
              [ "$BELOW" != "-" ] && ARGS="$ARGS --below-league $BELOW"
              [ "$ABOVE" != "-" ] && ARGS="$ARGS --above-league $ABOVE"
              python scripts/estimate_promoted_team_ratings.py --target-league "$LEAGUE" $ARGS --as-of "$D" > /tmp/est.log 2>&1
              EST=$?
              if [ $EST -eq 2 ]; then echo "::warning::$LEAGUE: unresolvable promoted/relegated team(s) as of $D"
              elif [ $EST -ne 0 ]; then echo "::error::$LEAGUE estimation failed as of $D"; tail -5 /tmp/est.log; FAILED=1; fi
            done
            python scripts/retrofit_verify_and_predict.py --league-code "$LEAGUE" --season-id "$SEASON" --dates "$DATES" || FAILED=1
            echo "::endgroup::"
          done < plan.txt
          exit $FAILED
