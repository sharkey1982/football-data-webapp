name: NFL model (branch run, temporary)
# TEMPORARY: first run of the daily model predictions (scripts/nfl_elo.py)
# from the nfl-model-lab branch. The experiments already ran. Deleted before merge.
on:
  push:
    branches: [nfl-model-lab]
    paths: [.github/workflows/nfl-lab-branch-run.yml]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Model predictions
        run: python scripts/nfl_elo.py
