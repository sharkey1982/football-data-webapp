name: NFL lab (branch run, temporary)
# TEMPORARY: from the nfl-model-lab branch, re-import NFL games with the new
# model fields, then score N0, N1 (tuning + validation) and N1's holdout once.
# Deleted before merge.
on:
  push:
    branches: [nfl-model-lab]
    paths: [.github/workflows/nfl-lab-branch-run.yml]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Re-import games with the model fields
        run: python scripts/nfl_import.py
      - name: N0
        run: python scripts/lab_nfl.py n0
      - name: N1 tuning and validation
        run: python scripts/lab_nfl.py n1
      - name: N1 holdout (once)
        run: python scripts/lab_nfl.py n1 --open-holdout
