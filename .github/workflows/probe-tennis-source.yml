name: Probe tennis source (temporary)
on:
  push:
    branches: [probe/tennis-source]
permissions:
  contents: read
env:
  UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
jobs:
  runner_page:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -sS -A "$UA" -o page.html -w "%{http_code}" http://www.tennis-data.co.uk/alldata.php || echo 000)
          test "$code" = 200 && grep -q '2026/2026.xlsx' page.html
  edge_page:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/tennis-source-probe" -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" > e.json
          jq -e '.page_status == 200 and (.links_2026|length) > 0' e.json
  edge_xlsx:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/tennis-source-probe" -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" > e.json
          jq -e '.file_status == 200 and .file_is_zip == true' e.json
