name: Dry-run migrations (temporary)
on:
  push:
    branches: [probe/tennis-source]
permissions:
  contents: read
jobs:
  dry:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        upto: [7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: psql
        run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: apply 1..N in one transaction, then roll back
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          files=$(ls dryrun/*.sql | sort | head -n ${{ matrix.upto }})
          { echo 'begin;'; for f in $files; do cat "$f"; echo; done; echo 'rollback;'; } > all.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f all.sql > out.txt 2>&1 || { grep -E "ERROR|DETAIL|HINT|WARNING" out.txt | tail -6 | sed "s/^/::error::/"; exit 1; }
          grep -E "^(CHK|JOB|BRD|RDY|FIX) " out.txt > rep.txt
      - run: grep -E "^CHK" rep.txt | head -10 | sed "s/^/::warning::/"
      - run: grep -E "^JOB" rep.txt | head -10 | sed "s/^/::warning::/"
      - run: grep -E "^(BRD|RDY|FIX)" rep.txt | head -10 | sed "s/^/::warning::/"
      - run: grep -E "^JOB" rep.txt | tail -n +11 | head -10 | sed "s/^/::warning::/"
