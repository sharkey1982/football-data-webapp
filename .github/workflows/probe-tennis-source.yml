name: Dry-run migrations (temporary)
on:
  push:
    branches: [probe/tennis-source]
permissions:
  contents: read
jobs:
  dry:
    strategy:
      fail-fast: false
      matrix:
        upto: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: psql
        run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: apply 1..N in one transaction, then roll back
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          files=$(ls dryrun/*.sql | sort | head -n ${{ matrix.upto }})
          { echo 'begin;'; for f in $files; do cat "$f"; echo; done; echo 'rollback;'; } > all.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f all.sql > out.txt 2>&1 || { grep -iE "error|warning|line" out.txt | tail -6 | sed "s/^/::error::/"; exit 1; }
