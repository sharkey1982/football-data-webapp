# ============================================================================
# Fetch statutory accounts from Companies House for finance ingestion.
#
# Why: Claude work sessions can't reach Companies House (egress allowlist),
# and scheduled/data jobs shouldn't depend on Chris's PC. This downloads the
# original accounts documents in the cloud and commits them, with a manifest
# of source URLs and SHA-256 hashes, to the `finance-sources` branch (never
# main). Sessions read that branch with git; run artifacts can't be used
# because their blob storage is blocked from work sessions too.
#
# Read-only: it writes nothing to the database. Loading happens later through
# a reviewed data migration (apply-migrations.yml), like every other DB write.
#
# Dispatch:
#   gh api -X POST repos/sharkey1982/football-data-webapp/actions/workflows/finance-fetch.yml/dispatches \
#     -f ref=main -f "inputs[companies]=01989823:2020 00054222:2020"
#   Club reports abroad: -f "inputs[reports]=real-madrid=https://.../report.pdf"
# ============================================================================
name: Finance fetch (Companies House)

on:
  workflow_dispatch:
    inputs:
      companies:
        description: 'Space-separated COMPANY_NUMBER[:FROM_YEAR], e.g. "01989823:2020 00054222:2020"'
        required: false
        default: ''
      reports:
        description: 'Space-separated slug=https-URL of clubs'' own annual reports (clubs outside the UK)'
        required: false
        default: ''

permissions:
  contents: write  # pushes the documents to the finance-sources branch

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        env:
          COMPANIES: ${{ inputs.companies }}
          REPORTS: ${{ inputs.reports }}
        run: |
          set -euo pipefail
          args=(--reports-out reports)
          for r in $REPORTS; do
            printf '%s' "$r" | grep -Eq '^[a-z0-9-]{2,40}=https://[^ ]+$' || { echo "::error::bad report input $r"; exit 2; }
            args+=(--report "$r")
          done
          for c in $COMPANIES; do
            printf '%s' "$c" | grep -Eq '^[A-Za-z0-9]{8}(:[0-9]{4})?$' || { echo "::error::bad input $c"; exit 2; }
            args+=(--company "$c")
          done
          python3 scripts/finance_fetch_companies_house.py --out ch "${args[@]}"
      - name: Commit to finance-sources branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "finance-fetch"
          git config user.email "actions@github.com"
          tmp=$(mktemp -d); mkdir -p ch reports; cp -r ch reports "$tmp/"
          if git ls-remote --exit-code --heads origin finance-sources >/dev/null; then
            git fetch -q --depth 1 origin finance-sources
            git checkout -q -B finance-sources FETCH_HEAD
          else
            git checkout -q --orphan finance-sources; git rm -rqf .
          fi
          git clean -fdxq
          mkdir -p companies-house annual-reports
          cp -r "$tmp"/ch/. companies-house/
          cp -r "$tmp"/reports/. annual-reports/
          git add companies-house annual-reports
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -qm "Companies House accounts, fetch run $RUN_ID"
          git push -q origin finance-sources
          echo "Pushed to finance-sources"
