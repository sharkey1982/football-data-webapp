name: Tennis refresh (events, editions, player summaries)

# Rebuilds the tennis summary tables (public.tennis_refresh(), migration
# 20261005090000) whenever matches have been imported since the last
# successful refresh. The rebuild takes about a minute, longer than the
# PostgREST statement limit, so it runs here over a direct connection
# (SUPABASE_DB_URL, the session pooler) rather than from the importer.
# Every two hours, on demand, and when this file changes. Logs pipeline_runs
# (tennis_refresh) only when it rebuilds.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing new was imported
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/tennis-refresh.yml]
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

concurrency:
  group: tennis-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rebuild if new matches were imported
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::SUPABASE_DB_URL is not set"; exit 1; fi
          stale=$(psql "$DB_URL" -Atq -v ON_ERROR_STOP=1 -c "
            select coalesce((select max(imported_at) from tennis.matches)
              > coalesce((select max(started_at) from public.pipeline_runs where job_name = 'tennis_refresh' and status = 'success'), 'epoch'), false)")
          echo "New matches since the last refresh: $stale (force: $FORCE)"
          if [ "$stale" != "t" ] && [ "$FORCE" != "true" ]; then exit 0; fi
          psql "$DB_URL" -Atq -v ON_ERROR_STOP=1 <<'SQL'
          set statement_timeout = '10min';
          with run as (insert into public.pipeline_runs (job_name, status) values ('tennis_refresh', 'running') returning run_id)
          select run_id from run \gset
          select public.tennis_refresh() as result \gset
          update public.pipeline_runs set status = 'success', summary = :'result', finished_at = now() where run_id = :run_id;
          select :'result';
          SQL
