# Minimal Supabase CLI config, enough to link and deploy functions.
# Deliberately NOT a full local-dev config: this project has ~335
# migrations that predate version control, so `supabase start` will not
# reproduce production yet (see README.md in this directory).
project_id = "ppzfmpbnojyjeblelsuz"

[functions.ingest-football-results]
verify_jwt = false
[functions.ingest-cup-data]
verify_jwt = false
[functions.backfill-football-raw]
verify_jwt = false
[functions.backfill-cup-raw]
verify_jwt = false
[functions.fpl-optimize-squad]
verify_jwt = false
# Social publishing (docs/social-publishing.md). The callback is reached by
# X redirecting the browser, so it cannot carry a Supabase JWT; start and
# publish check the admin's JWT themselves (same pattern as ai-lab-run).
[functions.x-oauth-start]
verify_jwt = false
[functions.x-oauth-callback]
verify_jwt = false
[functions.x-publish]
verify_jwt = false
