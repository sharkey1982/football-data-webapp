<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Beat the Shark — FixtureShark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

    --onPitch:#f2efe4;--paper:#e8e4d6;--paperink:#16160f;}

  .brk .bk{font-size:13.5px;width:120px;flex:none;color:var(--ink2)}
  .brk .bb{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
  .brk .bb i{display:block;height:100%;background:var(--pitch2)}
  .brk .bv{font-family:var(--mono);font-size:12.5px;width:52px;text-align:right;flex:none}

  .opt p{margin:0;font-size:13.5px}
  .opt .mis{font-size:12.5px;color:var(--ink);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
  .opt .mis b{color:var(--amber)}
  .seed{font-family:var(--mono);font-size:10.5px;color:var(--mute);text-align:center;margin-top:14px}

</style>

<body>
<div class="wrap">
  <header>
    <div class="hmain">
      <div class="bigscore" id="hScore">—<span class="sub">SCORE</span></div>
      <div class="twos" id="hTwo"></div>
      <div class="trend fl" id="hTrend"></div>
    </div>
    <div class="season" id="hSeason"></div>
  </header>
  <main id="app"></main>
  <div class="foot" id="foot"></div>
</div>
<script>
/* ===========================================================================
   SAVE OUR CLUB v7

   Scoring is now TWO THINGS ONLY: cash in the bank, and where you finish.
   Fifty points each. Everything else in the simulation -- squad quality,
   fitness, morale, supporters, the board -- still exists and still matters,
   but only because it moves those two numbers. That is the whole point: the
   levers are many, the scoreboard is simple.

   Also new:
   - Squad list shows QUALITY and CONDITION as numbers and pips.
   - OWNER gets two transfer windows: pre-season and January.
   - MANAGER gets a pre-season programme and a winter break.
   - STAR PLAYER gets a summer and a midwinter of his own, on and off the
     pitch, where the bad decisions are the interesting ones.
   =========================================================================== */
const R={s:0,next(){let a=this.s|=0;a=this.s=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const rng=()=>R.next(),rnd=(a,b)=>a+Math.floor(rng()*(b-a+1)),pick=a=>a[Math.floor(rng()*a.length)];
const shuffle=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
const clamp=(v,lo=0,hi=100)=>Math.max(lo,Math.min(hi,v));
const fmtMoney=v=>(v<0?"-£":"£")+Math.abs(Math.round(v))+"k";
function ord(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
const estRange=(v,e)=>`${fmtMoney(Math.round(v*(1-e)))}–${fmtMoney(Math.round(v*(1+e)))}`;
const DELAY_AMP=2.4,NOISE=.26;
let SEED="SOC-S01";

/* ---------------------------------------------------------------------------
   NAMES
   Your club is "Your Team" -- memorable, and the name of a page on the site.
   Rivals are affectionate puns on real clubs; players are puns on historical
   figures and a few long-retired legends. They are parody names attached to
   invented characters: no event anywhere mirrors a real person's history.
   The shark theme lives in the world around the football instead -- the
   papers, the podcast, the stadium, the league.
   ------------------------------------------------------------------------- */
const CLUB="Your Team";
const STADIUM="the Shark Tank";
/* THE LEAGUE AS A LESSON. Every club is named for how it makes decisions,
   and its strength follows from that: the more a club uses evidence, the
   better it does. Reading the table teaches the site's premise without a
   word of explanation. Names are nods only -- no real person or company is
   portrayed or given lines.
   Two names per tier, drawn by season, so a new season is a new league
   without diluting this one. The top tier is fixed: Chief Scout United are
   always the benchmark. */
const TIERS=[
  {str:72,names:[["Chief Scout United","recruit entirely on the model"]]},
  {str:60,names:[["Billy's Beane United","run on a Moneyball budget"],["Moneyball Athletic","buy what the market undervalues"]]},
  {str:52,names:[["Star Lizard","a syndicate that prices every match"],["Expected Goals Wanderers","trust the xG, eventually"]]},
  {str:44,names:[["Gut Feeling Town","sign whoever looked good on Saturday"],["Old School Rovers","do it the way it has always been done"]]},
  {str:35,names:[["No Stats FC","have never opened a spreadsheet"],["Whim FC","decide everything on the day"]]}
];
const RIVAL_STR=TIERS.map(t=>t.str);
let RIVALS=[];
function pickRivals(){
  R.s=hashSeed(SEED+"|rivals");
  RIVALS=TIERS.map(t=>{const[n,d]=pick(t.names);return{n,d,str:t.str}});
}
const SURNAMES=["Dean Holloway","Kyle Mottram","Reece Tanner","Jordan Ashby","Lewis Pritchard","Callum Fenwick",
  "Tom Ellery","Sam Oduya","Ryan Keogh","Jamie Whitlock","Ollie Barnes","Kieran Doyle","Aaron Slade","Luke Harrop",
  "Danny Marsh","Connor Fell","Tariq Hussain","Kofi Mensah","Nathan Oyelaran","Ben Castle","Liam Rourke","Joe Pritchett"];
const PAPERS=["THE DAILY FIN","THE GREAT WHITE PAGES","THE SUNDAY SHOAL","THE FINANCIAL FINS"];
const PUNDITS=[{n:"BRUCE",d:"a former centre-half with forty caps and no patience"},
  {n:"FLINT",d:"promoted twice, relegated three times, has seen everything"},
  {n:"OKORO",d:"the analyst, who quotes numbers at people"}];
const PODCAST="THE DEEP END";
const sharkRate=S=>`FixtureShark rate this squad <b>${S.squad}</b> — ${S.squad>62?"top-two material":S.squad>50?"mid-table on paper":"bottom-two on paper"}.`;

/* --- roles: same scoreboard, different levers ----------------------------- */
const ROLES={
owner:{id:"owner",name:"The Owner",tag:"You sign the cheques",
  blurb:"The club is yours, and so are the debts. Two transfer windows, a stadium and a chequebook. You do not pick the team.",
  mission:"BEAT THE SHARK",
  missionLong:"FixtureShark have predicted where you finish. Finish higher. Cash is not scored — it is what you spend to prove the model wrong.",
  pool:["kebab","mascot","wedding","barfly","scout","ticketprice","stadiumuse","creditor","rivalshark","director","tannoy","prawn","sharkdeal","bonus","bonus"]},
manager:{id:"manager",name:"The Manager",tag:"You pick the team",
  blurb:"Selection, training, the dressing room, and a pre-season you actually get to plan. You can ask the owner for money. Asking is all you can do.",
  mission:"BEAT THE SHARK",
  missionLong:"FixtureShark have predicted where you finish. Finish higher. Your shape, your selection and your half-time calls are the biggest levers in the game.",
  pool:["psychic","kitcolour","bus","tiktok","training","tactics","youth","discipline","medical","askowner","hisjob","mindgames","sharkscout"]},
player:{id:"player",name:"The Star Player",tag:"You are the asset",
  blurb:"You are the one being sold, chased and blamed. Everything you do on and off the pitch lands on someone else's balance sheet.",
  mission:"BEAT THE SHARK",
  missionLong:"FixtureShark have predicted where your club finishes. Drag it higher. You have less control than anyone — which makes beating the model harder.",
  pool:["selfpens","selfcontract","selfrole","selfdeadline","selfsponsor","selfextras","selfinjury","selfcaptain"]}
};
let ROLE=null,S=null;

/* --- season --------------------------------------------------------------- */
const MW=10;
let FIXTURES=[],TABLE={},PREDICT={};
function buildFixtures(){
  const teams=[CLUB].concat(RIVALS.map(r=>r.n)),n=teams.length,rounds=[],arr=teams.slice();
  for(let r=0;r<n-1;r++){const wk=[];for(let i=0;i<n/2;i++)wk.push([arr[i],arr[n-1-i]]);rounds.push(wk);arr.splice(1,0,arr.pop())}
  FIXTURES=rounds.concat(rounds.map(wk=>wk.map(([h,a])=>[a,h])));
}
const strOf=n=>n===CLUB?null:RIVALS.find(r=>r.n===n).str;
/* FORMATIONS. Each trades attack for defence in strength points. This is
   what lets a formation change, a goal bonus or a striker pushed up front
   pull the two in opposite directions -- which a single strength number
   could never express. */
const FORMATIONS={
  "4-4-2":{att:0,def:0,d:"Balanced"},
  "4-3-3":{att:8,def:-7,d:"Front three, thin in midfield"},
  "3-5-2":{att:4,def:-3,d:"Wing-backs, crowded middle"},
  "4-5-1":{att:-5,def:7,d:"Compact, one up top"},
  "5-3-2":{att:-8,def:10,d:"Five at the back"}
};
function oppFormation(n){
  /* Rivals pick shapes that suit their strength, with some variety. */
  const st=strOf(n);
  return st>=60?pick(["4-3-3","4-3-3","3-5-2"]):st<=44?pick(["5-3-2","4-5-1","5-3-2"]):pick(Object.keys(FORMATIONS));
}
/* Your club's goal rates against an opponent, with attack and defence
   modified independently by formation, bonuses and in-match changes. */
function clubRates(opp,home,scale,oppFm){
  const base=myStrength();
  const f=FORMATIONS[S.formation||"4-4-2"],of=FORMATIONS[oppFm||"4-4-2"];
  const att=base+(S.attMod||0)+f.att+(S.matchAtt||0);
  const def=base+(S.defMod||0)+f.def+(S.matchDef||0);
  const os=strOf(opp),oAtt=os+of.att,oDef=os+of.def,h=home?5:-5;
  const k=scale||1.25;
  return[Math.max(.08,k*Math.pow(1.5,(att+h-oDef)/20)),Math.max(.08,k*Math.pow(1.5,(oAtt-def-h)/20))];
}
const pois=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=rng()}while(p>L);return k-1};
/* One entry point for any fixture, so your club always uses the split
   engine and rivals use the simple one. */
function playFixture(h,a,credit){
  if(h!==CLUB&&a!==CLUB)return simScore(strOf(h),strOf(a));
  const home=h===CLUB,opp=home?a:h;
  const[m,t]=clubRates(opp,home,1.25,oppFormation(opp));
  const mg=Math.min(5,pois(m)),tg=Math.min(5,pois(t));
  /* credit=true where no vidiprinter names the scorers. The classified
     check names them itself, so it must NOT pass this -- or every goal
     there would be counted twice against a goal bonus. */
  if(credit)for(let i=0;i<mg;i++){const p=pickScorer();if(p)p.goals=(p.goals||0)+1}
  return home?[mg,tg]:[tg,mg];
}
function simScore(hs,as){
  const hx=Math.max(.2,1.25*Math.pow(1.5,(hs+5-as)/20)),ax=Math.max(.2,1.25*Math.pow(1.5,(as-hs-5)/20));
  const pois=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=rng()}while(p>L);return k-1};
  return[Math.min(5,pois(hx)),Math.min(5,pois(ax))];
}
let FORM={},CLEAN={};
function blankTable(){const t={};FORM={};CLEAN={};[CLUB].concat(RIVALS.map(r=>r.n)).forEach(n=>{t[n]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};FORM[n]=[];CLEAN[n]=0});return t}
function award(t,h,a,hg,ag){t[h].p++;t[a].p++;t[h].gf+=hg;t[h].ga+=ag;t[a].gf+=ag;t[a].ga+=hg;
  if(hg>ag){t[h].w++;t[h].pts+=3;t[a].l++}else if(hg<ag){t[a].w++;t[a].pts+=3;t[h].l++}else{t[h].d++;t[a].d++;t[h].pts++;t[a].pts++}
  if(FORM[h]){FORM[h].push(hg>ag?'w':hg<ag?'d':'d');FORM[h][FORM[h].length-1]=hg>ag?'w':hg===ag?'d':'l'}
  if(FORM[a]){FORM[a].push(ag>hg?'w':ag===hg?'d':'l')}
  if(ag===0&&CLEAN[h]!=null)CLEAN[h]++;
  if(hg===0&&CLEAN[a]!=null)CLEAN[a]++;}
function standings(t){return Object.entries(t).map(([n,v])=>({n,...v,gd:v.gf-v.ga}))
  .sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.n.localeCompare(y.n))}
function monteCarlo(runs=4000){
  const saved=R.s,counts={};[CLUB].concat(RIVALS.map(r=>r.n)).forEach(n=>counts[n]={sum:0,bot2:0,top:0});
  for(let i=0;i<runs;i++){const t=blankTable();
    FIXTURES.forEach(wk=>wk.forEach(([h,a])=>{const hs=h===CLUB?52:strOf(h),as=a===CLUB?52:strOf(a);
      const[hg,ag]=simScore(hs,as);award(t,h,a,hg,ag)}));
    standings(t).forEach((row,idx)=>{counts[row.n].sum+=idx+1;if(idx>=4)counts[row.n].bot2++;if(idx===0)counts[row.n].top++})}
  R.s=saved;const out={};for(const[n,c]of Object.entries(counts))out[n]={avg:c.sum/runs,rel:Math.round(c.bot2/runs*100),title:Math.round(c.top/runs*100)};
  return out;
}

/* --- THE SCORE: you against the Shark ------------------------------------
   The Shark's number is its pre-season prediction -- effectively what
   happens if a club makes no decisions at all. Matching it scores 50. Each
   place better is +15, each place worse -15, and winning the league adds 15.
   So the score is literally "how much better than the model were you". */
function sharkPos(){return Math.round(PREDICT[CLUB].avg)}
function scoreParts(){
  const pred=sharkPos(),diff=pred-S.pos;
  let total=50+diff*15+(S.pos===1?15:0);
  if(!S.alive)total*=.3;
  return{pred,diff,total:Math.round(clamp(total,0,100))};
}
function apply(fx,noisy){const out=[];
  for(const[k,v0]of Object.entries(fx||{})){if(!v0)continue;
    const v=noisy?Math.round(v0*(1+(rng()*2-1)*NOISE)):v0,M=x=>fmtMoney(Math.abs(x)).replace('-','');
    if(k==='cash'){S.cash+=v;out.push([`Cash ${v>0?'+':'−'}${M(v)}`,v>0])}
    else if(k==='debt'){S.debt+=v;out.push([`Debt ${v>0?'+':'−'}${M(v)}`,v<0])}
    else if(k==='wages'){S.wages+=v;out.push([`Wages ${v>0?'+':'−'}${M(v)}/w`,v<0])}
    else if(k==='squad'){S.squad=clamp(S.squad+v);out.push([`Squad ${v>0?'+':''}${v}`,v>0])}
    else if(k==='fans'){S.fans=clamp(S.fans+v);out.push([`Fans ${v>0?'+':''}${v}`,v>0])}
    else if(k==='board'){S.board=clamp(S.board+v);out.push([`Board ${v>0?'+':''}${v}`,v>0])}
    else if(k==='fatigue'){S.fatigue=clamp(S.fatigue+v);out.push([`Fatigue ${v>0?'+':''}${v}`,v<0])}
    else if(k==='form'){S.form=clamp(S.form+v);out.push([`Form ${v>0?'+':''}${v}`,v>0])}
    else if(k==='fitness'){S.fitness=clamp(S.fitness+v);out.push([`Fitness ${v>0?'+':''}${v}`,v>0])}
    else if(k==='interest'){S.interest=clamp(S.interest+v);out.push([`Interest ${v>0?'+':''}${v}`,v>0])}
    else if(k==='condition'){S.squadList.forEach(p=>{if(!p.gone)p.fit=clamp(p.fit+v)});out.push([`Condition ${v>0?'+':''}${v} all`,v>0])}}
  return out.map(([t,g])=>`<span class="${g?'up':'down'}">${t}</span>`).join('')}
function later(n,fx,text){if(!fx)return;const a={};for(const[k,v]of Object.entries(fx))a[k]=Math.round(v*DELAY_AMP);
  S.pending.push({at:cursor+n,fx:a,text})}
function drainPending(){const d=S.pending.filter(p=>p.at<=cursor);S.pending=S.pending.filter(p=>p.at>cursor);return d}

function ratingWith(extraRt,dropIdx){

   Deliberately NOT real people or their actual words -- these are new

/* BONUS STRUCTURES. One player per turn, and the position decides what the
   bonus actually does -- a goal bonus on a striker is a different decision
   from a goal bonus on a centre-back. That is where the variety comes from.
   Liabilities are settled at the end of the season, against real results. */
bonus(){
  /* Found by the season simulator: if injuries leave nobody AVAILABLE,
     this used to dereference undefined and crash the page. Injured players
     can still sign a bonus -- they are at the club, just not playing. */
  const cands=alive().filter(p=>!S.bonuses.some(b=>b.nm===p.nm));
  const p=pick(cands.length?cands:alive());
  const G={FW:{at:5,de:-1,note:"a striker chasing goals is still mostly a striker"},
           MF:{at:3,de:-3,note:"he will arrive late in the box, and leave gaps behind him"},
           DF:{at:2,de:-5,note:"a centre-back chasing goals is a centre-back not defending"},
           GK:{at:0,de:-2,note:"he will be up for every corner, which is a sentence nobody wants to write"}}[p.pos];
  const rate=p.pos==="FW"?6:p.pos==="MF"?9:14;
  return{sig:`bonus|${p.nm}|${p.pos}`,title:`${p.nm} wants a bonus`,
    lede:`${p.pos==="FW"?"Your striker":p.pos==="MF"?"A midfielder":p.pos==="DF"?"A defender":"Your goalkeeper"}, quality ${p.rt}. Three structures on the table.`,
    body:`<div class="shark"><div><b>FixtureShark</b>A goal bonus on a ${p.pos==="FW"?"forward":p.pos==="MF"?"midfielder":p.pos==="DF"?"defender":"goalkeeper"}:
      ${G.note}. Finishing-position money lifts everyone a little, because it rewards the result rather than the individual.</div></div>`,
    choices:[
      {t:`${fmtMoney(rate)} per goal he scores`,d:`Attack +${G.at}, defence ${G.de} · paid at the end, per goal`,
        fx:{},after(){S.attMod+=G.at;S.defMod+=G.de;S.bonuses.push({type:"goals",nm:p.nm,rate,from:p.goals||0})},
        out:`Signed. Watch where he stands at the next corner.`},
      {t:`${fmtMoney(60)} if you finish top three`,d:"Attack +2, defence +2 · paid only if it happens",
        fx:{},after(){S.attMod+=2;S.defMod+=2;S.bonuses.push({type:"finish",nm:p.nm,amt:60})},
        out:`A bonus for the result, not the scoresheet. He shrugs, and signs.`},
      {t:`${fmtMoney(3)} per appearance`,d:"Attack +1, defence +1 · a small, certain cost",
        fx:{},after(){S.attMod+=1;S.defMod+=1;S.bonuses.push({type:"apps",nm:p.nm,rate:3,from:S.played||0})},
        out:`Paid for turning up. Unexciting, and he turns up.`},
      {t:"No bonus",d:"Keep the money",fx:{board:2},out:`He takes it better than expected. His agent does not.`}]}},

function podcastSpec(){

function playOthers(wk){const out=[];
  FIXTURES[wk].forEach(([h,a])=>{if(h===CLUB||a===CLUB)return;
    const[hg,ag]=simScore(strOf(h),strOf(a));award(TABLE,h,a,hg,ag);out.push({h,a,hg,ag})});return out}
function myFixture(wk){return FIXTURES[wk].find(([h,a])=>h===CLUB||a===CLUB)}
function resolveMine(hg,ag,home){
  const mg=home?hg:ag,tg=home?ag:hg;let fx,res;
  if(mg>tg){res='w';fx={fans:7,board:7,cash:rnd(16,30)}}
  else if(mg===tg){res='d';fx={fans:1,board:1,cash:rnd(10,19)}}
  else{res='l';fx={fans:-7,board:-6,cash:rnd(8,15)}}
  S.formArr.push(res);S.lastRes=res;S.fatigue=clamp(S.fatigue+rnd(5,9));S.matchBoost=0;
  S.seasonLog.push({mw:S.mw+1,gf:mg,ga:tg,cs:tg===0?1:0});
  S.squadList.forEach(p=>{
    if(p.gone)return;
    if(p.out){p.out--;if(!p.out)p.fit=clamp(p.fit+18);return}   /* recovering */
    p.fit=clamp(p.fit-rnd(3,8),25,100);
    /* The lower the condition, the likelier the match breaks him. This is
       what makes the Physio Room matter rather than being a readout. */
    const risk=p.fit<55?.26:p.fit<70?.12:.04;
    if(rng()<risk){p.out=rnd(1,3);p.fit=clamp(p.fit-10)}
  });
  if(ROLE.id==="player"){S.fitness=clamp(S.fitness-rnd(2,6));S.form=clamp(S.form+(mg>tg?5:mg===tg?0:-4))}
  return{fx,res};
}
/* Who you are playing, and whether they are better than you. This was the

/* Team Strength, in the site's own currency: an attack rating and a defence

function teamAtt(n){const st=n===CLUB?myStrength()+(S.attMod||0)+FORMATIONS[S.formation||"4-4-2"].att:strOf(n);

function teamDef(n){const st=n===CLUB?myStrength()+(S.defMod||0)+FORMATIONS[S.formation||"4-4-2"].def:strOf(n);
  return Math.max(.35,1.55-(st-52)/26)}
function strengthTableHTML(){

function heatColour(d){

function posOf(n){return standings(TABLE).findIndex(r=>r.n===n)+1}
function formPips(n){const f=(FORM[n]||[]).slice(-5);

function winProb(oppName,home){
  const saved=R.s;let w=0,d=0;

/* CLASSIFIED CHECK: all three of the week's fixtures streamed together, in

  const st=standings(TABLE),me=st.findIndex(r=>r.n===CLUB),left=MW-S.mw;
  if(left>4||!TABLE[CLUB].p)return false;
  const top=st[0].pts-TABLE[CLUB].pts<=3&&me<=2;
  const safe=st[3]?st[3].pts:0;
  const bottom=me>=3&&TABLE[CLUB].pts-safe<=3;

}
function renderLiveWeek(){

/* Who scores. A player on a goal bonus shoots more, so he is likelier to be
   the name on the vidiprinter -- the bonus has a visible consequence. */
function pickScorer(){
  const pool=available().filter(p=>p.pos!=="GK");
  if(!pool.length)return null;
  const w=pool.map(p=>{let x=p.pos==="FW"?3:p.pos==="MF"?2:1;
    if(S.bonuses.some(b=>b.type==="goals"&&b.nm===p.nm))x*=2.2;return x});
  let r=rng()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
/* THE MANAGER'S HALF TIME: a real tactical panel, not a tone of voice.
   Pick a shape, make substitutions, push someone out of position, then
   send them back out. Every option states what it does to attack and
   defence, because that is the trade being made. */
function tacticalHalfTime(mg,tg,oFm,resume){
  const box=document.getElementById('htBox');
  let fm=S.formation,subs=[],oop=null;
  const tired=available().filter(p=>p.fit<72).sort((a,b)=>a.fit-b.fit).slice(0,3);
  const defenders=available().filter(p=>p.pos==="DF");
  function effect(){
    const f=FORMATIONS[fm],fb=FORMATIONS[S.formation];
    let at=f.att-fb.att,de=f.def-fb.def;
    at+=subs.length*2;de+=subs.length*1;
    if(oop){at+=5;de-=5}
    return{at,de};
  }
  function draw(){
    const e=effect();
    box.innerHTML=`<div style="margin-top:12px">
      <div class="datechip">HALF TIME · ${mg}–${tg} · THEY ARE IN ${oFm}</div>
      <h2 style="margin-top:5px">${mg<tg?"Losing. Change something.":mg===tg?"Level. Chase it or hold it?":"Ahead. Protect it or kill it?"}</h2>
      <div style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--mute);margin:8px 0 5px">FORMATION</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px">
        ${Object.entries(FORMATIONS).map(([k,v])=>`<button class="choice" data-fm="${k}" style="margin:0;padding:8px 2px;text-align:center;
          ${k===fm?'border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)':''}">
          <span class="t" style="font-size:13px">${k}</span>
          <span class="d" style="font-size:10px">${v.att>0?'+':''}${v.att}/${v.def>0?'+':''}${v.def}</span></button>`).join('')}
      </div>
      <div style="font-size:12px;color:var(--mute);margin-top:4px">${FORMATIONS[fm].d} · attack/defence</div>
      ${tired.length?`<div style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--mute);margin:12px 0 5px">SUBSTITUTIONS · FRESH LEGS FOR TIRED ONES</div>
        ${tired.map(p=>`<button class="choice" data-sub="${p.nm}" style="margin:0 0 5px;padding:8px 11px;
          ${subs.includes(p.nm)?'border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)':''}">
          <span class="t" style="font-size:14px">${subs.includes(p.nm)?"✓ ":""}Take off ${p.nm}</span>
          <span class="d">${p.pos}, condition ${p.fit} · +2 attack, +1 defence</span></button>`).join('')}`:''}
      ${defenders.length&&mg<=tg?`<div style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--mute);margin:12px 0 5px">OUT OF POSITION</div>
        <button class="choice" data-oop="1" style="margin:0 0 5px;padding:8px 11px;
          ${oop?'border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)':''}">
          <span class="t" style="font-size:14px">${oop?"✓ ":""}Push ${defenders[0].nm} up front</span>
          <span class="d">Centre-back as a target man · +5 attack, −5 defence</span></button>`:''}
      <div style="margin-top:10px;padding:8px 11px;border-radius:8px;background:var(--panel2);font-family:var(--mono);font-size:12.5px">
        Second-half change: <span style="color:${e.at>=0?'var(--good)':'var(--bad)'}">attack ${e.at>0?'+':''}${e.at}</span>
        · <span style="color:${e.de>=0?'var(--good)':'var(--bad)'}">defence ${e.de>0?'+':''}${e.de}</span></div>
      <button class="choice primary" id="goSecond" style="margin-top:9px"><span class="t">Send them back out</span></button></div>`;
    box.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{fm=b.dataset.fm;draw()});
    box.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const n=b.dataset.sub;
      subs=subs.includes(n)?subs.filter(x=>x!==n):(subs.length<3?subs.concat(n):subs);draw()});
    box.querySelectorAll('[data-oop]').forEach(b=>b.onclick=()=>{oop=!oop;draw()});
    document.getElementById('goSecond').onclick=()=>{
      const e=effect(),was=S.formation;
      /* The formation takes effect through S.formation, which clubRates
         reads. matchAtt/matchDef carry ONLY the subs and out-of-position
         parts -- otherwise the shape change would be counted twice. */
      const fAt=FORMATIONS[fm].att-FORMATIONS[was].att,fDe=FORMATIONS[fm].def-FORMATIONS[was].def;
      S.formation=fm;S.matchAtt=e.at-fAt;S.matchDef=e.de-fDe;
      /* subs: fresh legs now, and the tired man recovers a little */
      subs.forEach(n=>{const p=S.squadList.find(x=>x.nm===n);if(p)p.fit=clamp(p.fit+6)});
      S.fatigue=clamp(S.fatigue-subs.length*2);
      const bits=[fm!==was?`Switched from ${was} to ${fm}`:`Stayed in ${fm}`];
      if(subs.length)bits.push(`${subs.length} ${subs.length===1?"change":"changes"}: ${subs.join(", ")} off`);
      if(oop)bits.push(`${defenders[0].nm} pushed up front`);
      box.innerHTML=`<div style="margin-top:10px" class="outcome">${bits.join(". ")}.</div>`;
      resume();
    };
  }
  draw();
}

/* Ten matchweeks, every one of them watched: five as your own match with a
   half-time decision, five as a live classified check across all fixtures. */
const PLAN=["special1","heatmap","presser","match","live","physio","match","papers","event","live","podcast",
            "match","special2","stats","event","live","physio","match","call","live","event","match","papers","event","live","end"];
let cursor=0,pendingReveal=null,RECENT=new Set(),RECENT_Q=[];
function remember(s){RECENT.add(s);RECENT_Q.push(s);if(RECENT_Q.length>18)RECENT.delete(RECENT_Q.shift())}
function drawEvent(){let best=null;
  for(let t=0;t<9;t++){const c=SHAPES[pick(ROLE.pool)]();if(!RECENT.has(c.sig)){best=c;break}best=c}
  remember(best.sig);return best}
function next(){cursor++;showPending()}
function showPending(){
  const due=drainPending();
  if(!due.length)return step();
  paintHeader();
  document.getElementById('app').innerHTML=`<div class="card"><div class="datechip">IT CATCHES UP</div>
    ${due.map(p=>`<div class="outcome" style="border-left-color:var(--blue)">${p.text||"An earlier choice has caught up with you."}</div><div class="delta">${apply(p.fx)}</div>`).join('')}
    <button class="choice primary" id="pn" style="margin-top:11px"><span class="t">Continue</span></button></div>`;
  paintHeader();document.getElementById('pn').onclick=step;
}
function step(){
  if(!S.alive)return renderEnding();
  if(cursor>=PLAN.length)return renderEnding();
  const b=PLAN[cursor];
  if(b==="end")return renderEnding();
  if(b==="special1"){
    if(ROLE.id==="owner")return renderWindow("summer",next);
    if(ROLE.id==="manager")return renderSpec(preseasonSpec(),"JULY · PRE-SEASON",next);
    return renderSpec(playerSummerSpec(),"JULY · YOUR SUMMER",next);
  }
  if(b==="special2"){
    if(ROLE.id==="owner")return renderWindow("january",next);
    if(ROLE.id==="manager")return renderSpec(winterSpec(),"DECEMBER · THE WINTER BREAK",next);
    return renderSpec(playerWinterSpec(),"DECEMBER · MIDWINTER",next);
  }
  if(b==="match")return renderMatch(next);
  if(b==="round")return renderRoundup();
  if(b==="live")return renderLiveWeek();
  if(b==="heatmap")return renderHeatmap();
  if(b==="stats")return renderStats();
  if(b==="physio")return renderPhysio();
  if(b==="presser")return renderSpec(presserSpec(),"FRIDAY · PRESS CONFERENCE",next);
  if(b==="papers")return renderPapers();
  if(b==="podcast")return renderPodcast();
  if(b==="call")return renderSpec(callSpec(),"TUESDAY NIGHT",next);
  return renderSpec(drawEvent(),"THIS WEEK",next);
}

/* THE PHYSIO ROOM. Role-specific, because availability is a different
   problem depending on which chair you sit in. */
function physioSpec(){
  const out=S.squadList.filter(p=>!p.gone&&p.out);
  const fragile=available().filter(p=>p.fit<70).sort((a,b)=>a.fit-b.fit);
  const body=`<div class="shark"><div><b>The Physio Room</b>
      ${out.length?`<b>${out.length}</b> unavailable: ${out.map(p=>`${p.nm} (${p.out}w)`).join(", ")}. `:"Nobody is ruled out. "}
      ${fragile.length?`<b>${fragile.length}</b> below 70% condition and carrying real risk: ${fragile.slice(0,3).map(p=>p.nm).join(", ")}.`
        :"The squad is in decent order."}
      Squad fatigue is <b>${S.fatigue}%</b>.</div></div>${squadHTML()}`;
  if(ROLE.id==="owner")return{title:"The Physio Room is a cupboard with a bench in it",
    lede:"Your physio is part-time and shares a car park with the ice machine that has not worked since March.",
    body,
    choices:[
      {t:"Fund it properly",d:`${fmtMoney(70)} — full-time physio, working ice bath`,
        fx:{cash:-70,condition:12,board:3},delayed:{condition:8},
        delayedText:"The upgraded medical setup is showing. Two players who would have missed a month did not.",
        after(){S.physioLevel++},out:`A full-time physio, a functioning ice bath, and a room that no longer smells of the ice machine.`},
      {t:"Split the cost with the rugby club",d:`${fmtMoney(28)}, shared facility`,
        fx:{cash:-28,condition:6},out:`Two clubs, one physio, a fixture list that occasionally collides.`},
      {t:"Leave it",d:"The bench is fine",fx:{},delayed:{condition:-7},
        delayedText:"Three soft-tissue injuries in a fortnight. The part-time physio saw every one of them coming.",
        out:`It has lasted this long.`}]};
  if(ROLE.id==="player")return{title:"You are in the Physio Room more than the gym",
    lede:`Your own condition is ${Math.round(S.fitness)}%, and the table in there is always occupied.`,
    body,
    choices:[
      {t:"Pay for your own specialist",d:"Out of your wages, and it works",fx:{fitness:16,form:3,fans:-1},
        out:`Two sessions a week in a private clinic, paid for out of your own pocket. Nobody at the club asks how.`},
      {t:"Do the club programme properly",d:"Free, slower, fine",fx:{fitness:9},out:`Every exercise, every day, for once.`},
      {t:"Ignore it and play",d:"You feel alright",fx:{form:3,fitness:-6},
        delayed:{fitness:-14,form:-6},delayedText:"The thing you ignored has become the thing you cannot ignore.",
        out:`You feel alright. You have felt alright before.`}]};
  return{title:"The Physio Room, Thursday morning",
    lede:out.length?`${out.length} ruled out and a team to pick from what is left.`:"Everyone is available, which will not last.",
    body,
    choices:[
      {t:"Rest everyone under 70%",d:"Availability later, weaker on Saturday",
        fx:{squad:-4,condition:15,fatigue:-12},out:`Bikes and pool work for half the squad. Saturday will be thin.`},
      {t:"Strap them up and play them",d:"Strongest side now, more breakages later",
        fx:{squad:4,condition:-6,fatigue:5},delayed:{condition:-10},
        delayedText:"Playing the walking wounded has cost you. Two of them are now genuinely unavailable.",
        out:`Everyone who can walk, plays.`},
      {t:"Ask the owner to fund the treatment properly",d:"Not your budget, and it is the actual fix",
        fx:{board:-3,condition:9},after(){S.physioLevel++},
        out:`He grumbles, and he signs it off, and the ice bath works by Tuesday.`}]};

  if(!html)return html;
  html=html.replace(/<!--SQ-->[\s\S]*?<!--\/SQ-->/g,"");
  return html.replace(/<p([^>]*)>([\s\S]*?)<\/p>/g,(m,attrs,inner)=>{
    const first=inner.split(/(?<=[.!?])\s+(?=[A-Z"“])/)[0];
    return `<p${attrs}>${first}</p>`;
  });
}
function renderSpec(spec,chip,after){
  if(!spec.keepFull)spec=Object.assign({},spec,{body:tighten(spec.body)});
  paintHeader();
  document.getElementById('app').innerHTML=`<div class="card">
    <div class="datechip">${chip}</div><h1>${spec.title}</h1>
    ${spec.lede?`<p class="lede">${spec.lede}</p>`:''}
    ${pendingReveal?`<div class="outcome" style="border-left-color:var(--amber)">${pendingReveal}</div>`:''}
    ${spec.body||''}<div id="ch"></div></div>`;
  const box=document.getElementById('ch');
  spec.choices.forEach(c=>{
    const b=document.createElement('button');b.className='choice';
    b.innerHTML=`<span class="t">${c.t}</span>${c.d?`<span class="d">${c.d}</span>`:''}`;
    b.onclick=()=>{
      if(c.ask){pendingReveal=c.reveal();return renderSpec(spec,chip,after)}
      pendingReveal=null;if(c.after)c.after();
      const d=c.fx?apply(c.fx,true):'';
      if(c.delayed)later(2,c.delayed,c.delayedText);
      recalcSquadRating();paintHeader();
      const outTxt=c.out&&c.out.length>120?c.out.split(/(?<=[.!?])\s+(?=[A-Z"“])/)[0]:c.out;
      document.getElementById('app').innerHTML=`<div class="card"><div class="datechip">${chip}</div>
        <h2>${spec.title}</h2>${outTxt?`<div class="outcome">${outTxt}</div>`:''}${d?`<div class="delta">${d}</div>`:''}
        <button class="choice primary" id="nx" style="margin-top:11px"><span class="t">Continue</span></button></div>`;
      document.getElementById('nx').onclick=after;
    };box.appendChild(b);
  });
}
/* THE SPORTS CENTRE. Your match finishes first; the table is shown AS IT
   STANDS, with everyone else still to play; then their results come in one
   at a time and the table re-sorts under you. This is the Saturday-teatime
   feeling, and it only works because the other clubs are really playing. */
function tableRowsHTML(prevPos){
  const st=standings(TABLE),N=st.length;
  return `<table class="tbl"><thead><tr><th class="n">#</th><th>Club</th><th class="n">P</th><th class="n">GD</th><th class="n">Pts</th><th></th></tr></thead><tbody>
  ${st.map((r,i)=>{const was=prevPos?prevPos[r.n]:i+1,mv=was-(i+1);
    return `<tr class="${r.n===CLUB?'me':''} ${i>=N-2?'rel':''}" style="${mv?'background:color-mix(in srgb,var(--amber) 10%,transparent)':''}">
      <td class="n">${i+1}</td><td>${r.n}</td><td class="n">${r.p}</td><td class="n">${r.gd>0?'+':''}${r.gd}</td><td class="n">${r.pts}</td>
      <td style="font-family:var(--mono);font-size:11px;color:${mv>0?'var(--good)':mv<0?'var(--bad)':'var(--mute)'};width:26px">
        ${mv>0?'▲'+mv:mv<0?'▼'+Math.abs(mv):''}</td></tr>`}).join('')}</tbody></table>`;
}
function renderSportsCentre(){
  const wk=S.mw,final=wk===MW-1,fx=FIXTURES[wk];
  const mine=fx.find(([h,a])=>h===CLUB||a===CLUB),others=fx.filter(f=>f!==mine);
  const[mh,ma]=playFixture(mine[0],mine[1],true);
  const otherRes=others.map(([h,a])=>{const[hg,ag]=simScore(strOf(h),strOf(a));return{h,a,hg,ag}});
  const posMap=()=>{const m={};standings(TABLE).forEach((r,i)=>m[r.n]=i+1);return m};
  paintHeader();
  document.getElementById('app').innerHTML=`<div class="card">
    <div class="datechip">MATCHWEEK ${wk+1} OF ${MW} · ${final?"FINAL DAY":"THE RUN-IN"} · SPORTS CENTRE</div>
    <h1>${final?"Final day":"Every point counts now"}</h1>
    <p class="lede">${final?"Everything is decided in the next hour.":"You are in a race, and so are they."}</p>
    <div id="scMine"></div><div id="scTable"></div><div id="scFeed"></div><div id="scEnd"></div></div>`;
  const feed=document.getElementById('scFeed');
  /* 1. your result */
  setTimeout(()=>{
    const before=posMap();
    award(TABLE,mine[0],mine[1],mh,ma);
    const home=mine[0]===CLUB,{fx:myFx,res}=resolveMine(mh,ma,home);
    myPos();
    document.getElementById('scMine').innerHTML=`<div class="res mine" style="font-size:15px;padding:10px">
      <span><b>FULL TIME</b> · ${mine[0]} v ${mine[1]}</span><span class="sc">${mh}–${ma}</span></div>
      <div class="outcome" style="margin-top:8px">${res==='w'?"You have done your part.":res==='d'?"A point. Now it depends on everyone else.":"Beaten. Now you need help."}</div>`;
    document.getElementById('scTable').innerHTML=`<div class="datechip" style="margin:10px 0 5px">AS IT STANDS · OTHER MATCHES STILL PLAYING</div>${tableRowsHTML(before)}`;
    paintHeader();
    S._myFx=myFx;S._res=res;
    /* 2. everyone else, one at a time */
    let i=0;
    (function nextResult(){
      if(i>=otherRes.length)return finishSC();
      const r=otherRes[i++],prev=posMap();
      setTimeout(()=>{
        award(TABLE,r.h,r.a,r.hg,r.ag);myPos();
        const d=document.createElement('div');d.className='res';d.style.marginTop='6px';
        d.innerHTML=`<span><b>FULL TIME</b> · ${r.h} v ${r.a}</span><span class="sc">${r.hg}–${r.ag}</span>`;
        feed.appendChild(d);
        document.getElementById('scTable').innerHTML=`<div class="datechip" style="margin:10px 0 5px">${i<otherRes.length?"AS IT STANDS · ":""}${i<otherRes.length?(otherRes.length-i)+" STILL PLAYING":"FINAL TABLE THIS WEEK"}</div>${tableRowsHTML(prev)}`;
        paintHeader();nextResult();
      },1700);
    })();
  },900);
  function finishSC(){
    S.mw++;const d=apply(S._myFx,true);myPos();paintHeader();
    const st=standings(TABLE),me=S.pos;
    const verdict=final
      ?(me===1?"Champions.":me>=st.length-1?"Relegated.":`${ord(me)}, and safe.`)
      :(me===1?"Top of the table.":me>=st.length-1?"In the drop zone.":`${ord(me)} of six.`);
    document.getElementById('scEnd').innerHTML=`<div class="outcome" style="margin-top:10px;font-size:16px"><b>${verdict}</b></div>
      <div class="delta">${d}</div>
      <button class="choice primary" id="mn" style="margin-top:10px"><span class="t">${final?"To the final whistle":"Continue"}</span></button>`;
    document.getElementById('mn').onclick=next;
  }
}
/* The favourite usually wins. Usually. Saying so out loud, against what
   actually happened, is the whole educational point of the Monte Carlo. */
function probabilityLesson(){
  const fav=RIVALS.slice().sort((a,b)=>PREDICT[b.n].title-PREDICT[a.n].title)[0];
  const odds=PREDICT[fav.n].title;
  const champ=standings(TABLE)[0].n;
  const held=champ===fav.n;
  const cOdds=PREDICT[champ]?PREDICT[champ].title:0;
  return `<div class="shark" style="margin-top:12px"><div><b>How often the favourite wins</b>
    ${fav.n} were given a <b>${odds}%</b> chance of the title.
    ${held?`They won it. That is the usual outcome, and it is still not a certainty — replay this season and roughly one time in ${Math.max(2,Math.round(100/(100-odds)))} they do not.`
      :`<b>${champ}</b> won it instead, from ${cOdds}% odds. That happens roughly one season in ${Math.max(2,Math.round(100/Math.max(1,100-odds)))} — a ${odds}% favourite is not a sure thing.`}
    </div></div>`;
}
/* --- ending --------------------------------------------------------------- */
function renderEnding(){
  while(S.mw<MW){const wk=S.mw,[h,a]=myFixture(wk),home=h===CLUB;
    const[hg,ag]=playFixture(h,a,true);
    award(TABLE,h,a,hg,ag);playOthers(wk);resolveMine(hg,ag,home);S.mw++}
  const st=standings(TABLE);myPos();
  const rel=S.pos>=st.length-1;
  /* Bonuses are paid on what actually happened, not on the promise. */
  let owed=0;const lines=[];
  (S.bonuses||[]).forEach(b=>{
    const p=S.squadList.find(x=>x.nm===b.nm);
    if(b.type==="goals"){const g=Math.max(0,((p&&p.goals)||0)-b.from),c=g*b.rate;owed+=c;
      lines.push(`${b.nm}: ${g} ${g===1?"goal":"goals"} × ${fmtMoney(b.rate)} = ${fmtMoney(c)}`)}
    else if(b.type==="finish"){const c=S.pos<=3?b.amt:0;owed+=c;
      lines.push(`${b.nm}: top-three bonus ${S.pos<=3?"triggered":"not triggered"} = ${fmtMoney(c)}`)}
    else if(b.type==="apps"){const n=Math.max(0,MW-b.from),c=n*b.rate;owed+=c;
      lines.push(`${b.nm}: ${n} appearances × ${fmtMoney(b.rate)} = ${fmtMoney(c)}`)}
  });
  if(owed&&!S.bonusesSettled){S.cash-=owed;S.bonusesSettled=true}
  S._bonusLines=lines;S._bonusOwed=owed;
  const{total}=scoreParts();
  const pred=PREDICT[CLUB],predPos=Math.round(pred.avg),beat=predPos-S.pos;
  let v,b;
  if(!S.alive){v="ADMINISTRATION";b="The club went under. The Shark wins by default."}
  else if(S.pos===1){v="CHAMPIONS";b=`The Shark gave you a ${pred.title}% chance of the title. You were the ${pred.title}%.`}
  else if(beat>=2){v="YOU BEAT THE SHARK";b=`Predicted ${ord(predPos)}, finished ${ord(S.pos)}. That is not luck — the model does not know about your decisions.`}
  else if(beat===1){v="YOU BEAT THE SHARK";b=`One place better than the model. Narrow, and it counts.`}
  else if(beat===0){v="THE SHARK WAS RIGHT";b=`Exactly where it said. Everything you did cancelled out — which is its own kind of lesson.`}
  else if(rel){v="THE SHARK WINS";b=`Predicted ${ord(predPos)}, and you went down. The model was kinder to you than your decisions were.`}
  else{v="THE SHARK WINS";b=`Predicted ${ord(predPos)}, finished ${ord(S.pos)}. The model would have done better by doing nothing.`}
  paintHeader();
  document.getElementById('app').innerHTML=`<div class="card">
    <div class="datechip">FINAL DAY · ${ROLE.name.toUpperCase()}</div>
    <div class="verdict ${!rel&&S.alive?'ok':'fail'}">${v}</div><p class="lede">${b}</p>
    <div style="font-family:var(--disp);font-size:54px;font-weight:700;line-height:1;margin:4px 0 10px;
      color:${total>=65?'var(--good)':total>=40?'var(--amber)':'var(--bad)'}">${total}<span style="font-size:20px;color:var(--mute)">/100</span></div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:4px 0 10px;text-align:center">
      <div style="background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px">
        <div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--mute)">THE SHARK SAID</div>
        <div style="font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.1">${ord(predPos)}</div></div>
      <div style="font-family:var(--disp);font-size:22px;color:var(--mute)">v</div>
      <div style="background:var(--panel2);border:1.5px solid ${beat>0?'var(--good)':beat<0?'var(--bad)':'var(--line)'};border-radius:9px;padding:9px">
        <div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--mute)">YOU FINISHED</div>
        <div style="font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.1">${ord(S.pos)}</div></div>
    </div>
    <p class="small">Matching the model scores 50. Every place better is worth 15, every place worse costs 15, and the title adds 15.
      The Shark's prediction is roughly what happens if a club makes no decisions at all — so this score measures what your decisions were worth.</p>

    ${S._bonusLines&&S._bonusLines.length?`<div class="shark" style="margin-top:12px"><div><b>Bonuses settled</b>
      ${S._bonusLines.join("<br>")}<br><b>Total: ${fmtMoney(S._bonusOwed)}</b>, taken from cash before the score above.</div></div>`:''}
    ${probabilityLesson()}
    <div style="margin-top:12px">${tableHTML()}</div>
    <button class="choice primary" id="again" style="margin-top:11px"><span class="t">Same season, different decisions</span><span class="d">Identical seed — beat your own score</span></button>
    <button class="choice" id="role"><span class="t">Same season, different role</span><span class="d">The same club from another chair</span></button>
    <button class="choice" id="rand"><span class="t">A new season</span><span class="d">New seed</span></button>
    <div class="seed">seed ${SEED} · ${ROLE.id}</div></div>`;
  document.getElementById('again').onclick=()=>boot();
  document.getElementById('role').onclick=chooseRole;
  document.getElementById('rand').onclick=()=>{SEED="SOC-S"+String(rnd(2,99)).padStart(2,'0');chooseRole()};
}
/* --- start ---------------------------------------------------------------- */
function chooseRole(){
  S=null;
  /* Build the fixture list and run the model now, so the opening screen can
     state the real prediction instead of asserting a league position that
     nothing has yet produced. */
  pickRivals();
  R.s=hashSeed(SEED+"|preview");
  buildFixtures();TABLE=blankTable();PREDICT=monteCarlo(2000);
  const pp=Math.round(PREDICT[CLUB].avg),prel=PREDICT[CLUB].rel;
  document.getElementById('hScore').innerHTML=`—<span class="sub">SCORE</span>`;
  document.getElementById('hTwo').innerHTML="";document.getElementById('hTrend').textContent="";
  document.getElementById('hSeason').innerHTML="";
  document.getElementById('app').innerHTML=`<div class="card">
    <div class="datechip">FIXTURESHARK · A SEASON IN FIVE MINUTES</div>
    <h1>Beat the Shark</h1>
    <p class="small" style="margin-top:-4px">Home: ${STADIUM}. Last full: 2009.</p>
    <p class="small">FixtureShark predict <strong>${ord(pp)} of six</strong>, relegated in <strong>${prel}%</strong> of 2,000 simulated seasons. £850k of debt, a fortnight's cash.</p>
    <p class="small"><strong>The Shark has predicted where you finish. Your job is to prove it wrong.</strong></p>
    ${["manager","owner","player"].map(k=>ROLES[k]).map(r=>`<button class="opt" data-r="${r.id}"
      ${r.id==="manager"?'style="border-color:var(--amber)"':''}><div class="tag">${r.tag}${r.id==="manager"?" · most influence over results":r.id==="player"?" · hardest":""}</div><h3>${r.name}</h3>
      <p>${r.blurb}</p><div class="mis"><b>Your levers:</b> ${r.id==="owner"?"two transfer windows, the stadium, ticket prices, sponsors and creditors."
        :r.id==="manager"?"pre-season, training, tactics, selection, discipline and a winter break."
        :"your body, your mouth, your agent and your summer."}</div></button>`).join('')}
    <div class="seed">seed ${SEED}</div></div>`;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ROLE=ROLES[b.dataset.r];boot()});
}
function boot(){
  pickRivals();
  R.s=hashSeed(SEED+"|"+ROLE.id);RECENT=new Set();RECENT_Q=[];
  S=newState();cursor=0;pendingReveal=null;
  buildFixtures();TABLE=blankTable();PREDICT=monteCarlo();
  recalcSquadRating();myPos();paintHeader();
  const pr=PREDICT[CLUB];
  document.getElementById('app').innerHTML=`<div class="card">
    <div class="datechip">${ROLE.name.toUpperCase()} · ${CLUB} · JULY</div>
    <h1>${ROLE.mission}</h1><p class="lede">${ROLE.missionLong}</p>
    <div class="shark"><div><b>FixtureShark pre-season model</b>${sharkRate(S)}
      Nothing has been played. Simulating the season 4,000 times, the model has ${CLUB} finishing
      <b>${ord(Math.round(pr.avg))}</b> on average and relegated in <b>${pr.rel}%</b> of them —
      a projection built on the squad you are left with, not on results. ${RIVALS.map(r=>`${r.n} ${ord(Math.round(PREDICT[r.n].avg))}`).join(" · ")}</div></div>
    <h2>Your squad</h2>${squadHTML()}
    <h2>Predicted table</h2>${predictedTableHTML()}
    <button class="choice primary" id="go" style="margin-top:11px"><span class="t">Begin</span>
      <span class="d">${ROLE.id==="owner"?"The summer window is open":ROLE.id==="manager"?"Pre-season starts Monday":"Six weeks of summer"}</span></button></div>`;
  document.getElementById('go').onclick=()=>{cursor=0;step()};
}
document.getElementById('foot').innerHTML="FixtureShark · Beat the Shark · fictional clubs, players, papers and pundits";
chooseRole();
</script>
