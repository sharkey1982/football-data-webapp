<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* Trailing-slash guard. MUST stay first in <head>, before anything loads.
   The game loads its scripts by relative path ("config.js"). Served through
   the main site's proxy at /play/beat-the-shark WITHOUT a trailing slash,
   those resolve to /play/config.js -- which does not exist -- and the page
   loads blank. This adds the slash before any script is requested.
   It cannot be done as a Netlify redirect: Netlify ignores trailing slashes
   when matching, so such a rule loops forever (it did). At the game site's
   own root the path is "/", which already ends in a slash, so it does
   nothing there. */
(function(){var p=location.pathname;
  if(p.length>1&&p.charAt(p.length-1)!=="/"&&!/\.[a-z0-9]+$/i.test(p))
    location.replace(p+"/"+location.search+location.hash);})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Shark — FixtureShark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#eceadf;--panel:#fffdf8;--panel2:#f6f3e9;--ink:#122a1c;--ink2:#47574b;--mute:#8b9a8e;--line:#dcd7c6;
    --pitch:#173a26;--pitch2:#2d6b48;--amber:#c9901a;--red:#a8322b;--blue:#2b5877;--good:#2d6b48;--bad:#a8322b;
    --onPitch:#f6f4ea;--paper:#f4f1e4;--paperink:#1a1a17;
    --disp:"Barlow Condensed",Impact,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d120e;--panel:#161d17;--panel2:#1c241d;--ink:#e9e5d7;--ink2:#b4bfb5;--mute:#7c8a7e;--line:#2a332a;
    --pitch:#245c3c;--pitch2:#43976a;--amber:#e3b03c;--red:#d96a61;--blue:#6fa3c9;--good:#43976a;--bad:#d96a61;
    --onPitch:#f2efe4;--paper:#e8e4d6;--paperink:#16160f;}}
  :root[data-theme="dark"]{--bg:#0d120e;--panel:#161d17;--panel2:#1c241d;--ink:#e9e5d7;--ink2:#b4bfb5;--mute:#7c8a7e;
    --line:#2a332a;--pitch:#245c3c;--pitch2:#43976a;--amber:#e3b03c;--red:#d96a61;--blue:#6fa3c9;--good:#43976a;--bad:#d96a61;
    --onPitch:#f2efe4;--paper:#e8e4d6;--paperink:#16160f;}
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 13px 34px}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
    background:linear-gradient(180deg,var(--pitch),color-mix(in srgb,var(--pitch) 84%,black));
    color:var(--onPitch);margin:0 -13px 11px;padding:9px 13px 10px;border-bottom:3px solid var(--amber)}
  .hmain{display:flex;align-items:center;gap:11px}
  .bigscore{font-family:var(--disp);font-size:40px;font-weight:700;line-height:.95;min-width:56px}
  .bigscore .sub{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;opacity:.7;font-weight:400;margin-top:3px}
  .twos{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
  .two{background:rgba(255,255,255,.11);border-radius:7px;padding:5px 8px 6px}
  .two .k{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.74}
  .two .v{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.2}
  .two .v.neg{color:#ffb3ab}
  .two .pts{font-family:var(--mono);font-size:9px;opacity:.7}
  .trend{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:4px;white-space:nowrap}
  .trend.up{background:rgba(127,211,162,.22);color:#9ce0b9}
  .trend.dn{background:rgba(224,138,128,.22);color:#f0a89f}
  .trend.fl{background:rgba(255,255,255,.12);opacity:.8}
  .season{margin-top:9px}
  .season .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;opacity:.82;margin-bottom:3px}
  .track{height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
  .track i{display:block;height:100%;background:var(--amber);transition:width .4s ease}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px}
  .datechip{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:600}
  h1{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.1;margin:6px 0 9px}
  h2{font-family:var(--disp);font-weight:700;font-size:20px;margin:0 0 9px}
  p{margin:0 0 10px;color:var(--ink2)}p.lede{color:var(--ink);font-size:16.5px}.small{font-size:13px}
  button{font:inherit;cursor:pointer}
  .choice{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);
    border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;transition:.12s}
  .choice:hover{border-color:var(--pitch2);background:var(--panel)}
  .choice:disabled{opacity:.42;cursor:not-allowed}
  .choice .t{font-weight:600;font-size:15px;display:block;color:var(--ink)}
  .choice .d{font-size:12.5px;color:var(--mute);margin-top:2px;display:block}
  .choice.primary{background:var(--pitch);border-color:var(--pitch);color:var(--onPitch)}
  .choice.primary .t{color:var(--onPitch)}.choice.primary .d{color:rgba(246,244,234,.78)}
  .outcome{border-left:3px solid var(--pitch2);background:color-mix(in srgb,var(--pitch2) 9%,transparent);
    padding:9px 11px;border-radius:0 6px 6px 0;margin:0 0 10px;font-size:14.5px;color:var(--ink)}
  .delta{font-family:var(--mono);font-size:12px;margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 11px}
  .up{color:var(--good)}.down{color:var(--bad)}
  .est{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
  /* squad rows with quality + condition */
  .sq{display:flex;flex-direction:column;gap:5px;margin:4px 0 11px}
  .pl{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13.5px}
  .pl.me{outline:1.5px solid var(--amber)}
  .pl.gone{opacity:.38;text-decoration:line-through}
  .pl .pos{font-family:var(--mono);font-size:10px;color:var(--onPitch);background:var(--pitch2);border-radius:3px;padding:1px 5px;flex:none}
  .pl .nm{flex:1;font-weight:500;min-width:0}
  .pl .nm small{display:block;font-size:11px;color:var(--mute);font-weight:400}
  .pl .stat{text-align:right;flex:none;width:56px}
  .pl .stat .lb{font-family:var(--mono);font-size:8px;letter-spacing:.07em;color:var(--mute);text-transform:uppercase}
  .pl .stat .vv{font-family:var(--mono);font-size:13px;font-weight:600}
  .pips{display:flex;gap:2px;justify-content:flex-end;margin-top:2px}
  .pips i{width:6px;height:6px;border-radius:1px;background:var(--line);display:block}
  .pips i.on{background:var(--pitch2)}
  .pips i.hot{background:var(--amber)}
  .pips i.bad{background:var(--bad)}
  .market{border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;background:var(--panel2)}
  .market .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .market .nm{font-weight:600}
  .market .fee{font-family:var(--mono);font-weight:600}
  .market .meta{font-size:12.5px;color:var(--mute);margin-top:2px}
  .market .quip{font-size:13px;color:var(--ink2);margin-top:6px;font-style:italic}
  .paper{background:var(--paper);color:var(--paperink);border-radius:9px;padding:14px 15px;margin-bottom:10px;border:1px solid rgba(0,0,0,.12)}
  .paper .masthead{font-family:var(--disp);font-size:15px;letter-spacing:.12em;text-transform:uppercase;
    border-bottom:2px solid var(--paperink);padding-bottom:4px;margin-bottom:8px;display:flex;justify-content:space-between}
  .paper .hl{font-family:var(--disp);font-size:28px;line-height:1.02;font-weight:700;margin:0 0 6px;text-transform:uppercase}
  .paper .standfirst{font-size:13.5px;color:#3a3a32;margin:0}
  .paper .byline{font-family:var(--mono);font-size:10px;color:#5a5a50;margin-top:7px}
  .pod{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px}
  .pod .show{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
  .quote{display:flex;gap:9px;margin-bottom:9px}
  .quote .who{font-family:var(--mono);font-size:10.5px;color:var(--mute);width:54px;flex:none;padding-top:2px;text-align:right}
  .quote .said{flex:1;font-size:14px;color:var(--ink);font-style:italic}
  .shark{display:flex;gap:9px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:0 8px 8px 0;padding:9px 11px;margin:0 0 11px;font-size:13.5px;color:var(--ink2)}
  .shark b{color:var(--ink);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:2px}
  .beat{text-align:center;color:var(--mute);font-family:var(--mono);font-size:11px;letter-spacing:.14em;margin:12px 0;opacity:.75}
  .vp{font-family:var(--mono);font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;min-height:160px}
  .vp .teams{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .ln{display:flex;gap:9px;padding:3px 0;animation:fade .25s}
  .ln .min{width:36px;color:var(--mute);flex:none}.ln .tx{flex:1}.ln .sc{font-weight:600}
  .ln.goal .tx{color:var(--pitch2);font-weight:600}.ln.against .tx{color:var(--bad)}
  .ln.ft{margin-top:6px;padding-top:7px;border-top:1px solid var(--line);font-weight:600;color:var(--ink)}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1}}
  .res{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:6px 8px;border-radius:7px;background:var(--panel2);margin-bottom:5px}
  .res.mine{outline:1.5px solid var(--amber)}
  .res .sc{font-family:var(--mono);font-weight:600;flex:none}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 3px;border-bottom:1px solid var(--line)}
  .tbl td{padding:5px 3px;border-bottom:1px solid var(--line)}
  .tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono)}
  .tbl tr.me td{background:color-mix(in srgb,var(--amber) 16%,transparent);font-weight:600}
  .tbl tr.rel td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  .tbl tr:last-child td{border-bottom:0}
  .verdict{font-family:var(--disp);font-size:32px;font-weight:700;line-height:1.05;margin:2px 0 6px}
  .verdict.ok{color:var(--good)}.verdict.fail{color:var(--bad)}
  .brk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .brk .bk{font-size:13.5px;width:120px;flex:none;color:var(--ink2)}
  .brk .bb{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
  .brk .bb i{display:block;height:100%;background:var(--pitch2)}
  .brk .bv{font-family:var(--mono);font-size:12.5px;width:52px;text-align:right;flex:none}
  .opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:8px;background:var(--panel2);width:100%;text-align:left;color:var(--ink)}
  .opt .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
  .opt h3{font-family:var(--disp);font-size:21px;margin:3px 0 4px;font-weight:700}
  .opt p{margin:0;font-size:13.5px}
  .opt .mis{font-size:12.5px;color:var(--ink);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
  .opt .mis b{color:var(--amber)}
  .seed{font-family:var(--mono);font-size:10.5px;color:var(--mute);text-align:center;margin-top:14px}
  .foot{font-size:11.5px;color:var(--mute);text-align:center;margin-top:12px;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hmain">
      <div class="bigscore" id="hScore">—<span class="sub">SCORE</span></div>
      <div class="twos" id="hTwo"></div>
      <div class="trend fl" id="hTrend"></div>
    </div>
    <div class="season" id="hSeason"></div>
  </header>
  <main id="app"></main>
  <div class="foot" id="foot"></div>
</div>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="content.js"></script>
<script src="matchday.js"></script>
<script src="ui.js"></script>

</body>
</html>
