# ============================================================================
# netlify.toml
#
# Explicit build config (matching what's already working via dashboard
# settings, made explicit so it can't drift) plus a functions directory --
# added specifically to support a serverless proxy for triggering GitHub
# Actions workflows from the frontend, since the GitHub token those
# workflows need can never be embedded in client-side JS (anyone could
# extract it from the bundle and get write access to the repo).
# ============================================================================

[build]
  # Prerendering is deliberately NOT chained here. The reasoning when it
  # was added -- "prerender always exits 0, so it can never fail the
  # build" -- was correct about the SCRIPT but missed the real cost:
  # puppeteer as a dependency makes Netlify download Chromium on every
  # npm install. Deploys stopped dead from the moment that landed, and
  # stayed broken for over an hour across four pushes, while the last
  # good deploy kept serving. The script exiting 0 never came into it;
  # the build was dying before it ran.
  #
  # Removed rather than patched because the browser-based approach was a
  # dead end anyway: at ~2-4s per page it cannot prerender the ~1,240
  # canonical entity pages inside a 15-minute build limit. The
  # replacement is renderToString-based SSG, which needs no browser at
  # all -- so puppeteer goes with it.
  # Sitemap generation is chained here, unlike the prerenderer that was
  # removed: it starts no server, launches no browser, spawns no child
  # process, hard-timeouts every request, and calls process.exit()
  # unconditionally -- so it cannot repeat the "finished its work but
  # never exited" hang that took deploys down for an hour. It also never
  # exits non-zero: a missing sitemap must never cost a deploy.
  command = "npm run build && npm run build:ssr && npm run static && npm run sitemap"
  publish = "dist"

  # Skip the analytics build when a push ONLY touches the game or docs.
  # The game deploys as its own Netlify site (games/beat-the-shark), so a
  # game change has no reason to run the full build, SSR and static
  # generation here. Exit 0 = skip.
  #
  # The first test is essential. On a build with no cache -- notably
  # "Clear cache and deploy", the thing you reach for when something is
  # wrong -- Netlify sets CACHED_COMMIT_REF to the SAME commit as
  # COMMIT_REF, git diff finds nothing, and without this check the build
  # would be cancelled. Equal refs always build. A git error also exits
  # non-zero and builds, so the rule fails safe -- which matters: a broken
  # deploy pipeline here once took the site down for over an hour.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)games' ':(exclude)docs'"

[functions]
  directory = "netlify/functions"

# Explicit no-cache on the HTML shell -- added after two separate reports
# of the live site visibly not matching what was just deployed. Without
# this, a browser (or an intermediate cache) is free to hold onto an old
# index.html indefinitely, which keeps pointing at the OLD hashed JS/CSS
# bundle filenames even though the new ones are already live -- Netlify's
# own CDN cache is purged on every deploy, so this is specifically about
# caches Netlify doesn't control. Hashed assets under /assets/ are the
# opposite: their filename changes on every build, so they're safe to
# cache aggressively and immutably -- there's no "stale" version to worry
# about, a new build just produces new filenames.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Every other prerendered route's own index.html (/fixtures/index.html,
# /table/index.html, etc.) -- same reasoning as the two rules above,
# widened to cover them now that prerendering writes one per canonical
# route. Netlify applies the most specific matching path, so /assets/*
# below still wins for hashed assets regardless of this broader rule.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ----------------------------------------------------------------------------
# Starting Lineups moved from Football to Fantasy (/fpl/line-ups). The old
# address has no pre-built page any more, so without this any existing link
# or search result would 404. Different paths, so no trailing-slash loop.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/football/lineups"
  to = "/fpl/line-ups"
  status = 301
  force = true

# ----------------------------------------------------------------------------
# /play/beat-the-shark/ -> the separately deployed game.
#
# Status 200 makes this a PROXY rather than a redirect: the visitor stays on
# this domain while the game is served from its own Netlify site
# (fixtureshark-beat-the-shark), so the two deploys stay independent.
#
# There is deliberately NO rule here to add the trailing slash. An earlier
# version had one ("/play/beat-the-shark" -> "/play/beat-the-shark/", 301),
# and it created an INFINITE REDIRECT LOOP: Netlify normalises trailing
# slashes before matching, so that rule also matched the slashed URL and
# redirected it to itself. The slash is added inside the game instead, by a
# guard at the top of its index.html. Link to /play/beat-the-shark/ WITH the
# slash wherever possible.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/play/beat-the-shark/*"
  to = "https://fixtureshark-beat-the-shark.netlify.app/:splat"
  status = 200
  force = true
