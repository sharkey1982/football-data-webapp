# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# FixtureShark FPL eval pilot: objective checks (the pass/fail verdict).
# Development only. Run by hand; see README.md. Nothing here touches the site,
# Supabase or Netlify.
description: FixtureShark FPL analysis - objective checks

# Both versions are listed so they can be compared; choose with
# --filter-prompts (the GitHub workflow's "prompt" input does this).
prompts:
  - id: file://prompts/fpl_analyst_v1.mjs
    label: fpl_analyst_v1
  - id: file://prompts/fpl_analyst_v2.mjs
    label: fpl_analyst_v2

# Live provider: the same Anthropic model the AI Lab uses by default
# (supabase/functions/ai-lab-run DEFAULT_MODEL). Reads ANTHROPIC_API_KEY
# from the environment. Offline runs replace it with -r (see README.md).
providers:
  - id: anthropic:messages:claude-sonnet-5
    label: claude-sonnet-5
    config:
      temperature: 0
      # The model's thinking counts against max_tokens. 1500 was too low: on
      # 2026-10-11 six of ten answers were cut off (two spent it all thinking
      # and returned nothing). Only tokens actually used are billed.
      max_tokens: 8000

tests: file://tests/load-tests.mjs

# Deterministic only: six javascript checks per case, added by the loader.
# The qualitative judge is a separate run (promptfooconfig.judge.yaml) so a
# model's opinion can never turn a failed numerical check into a pass.
evaluateOptions:
  maxConcurrency: 2

sharing: false
